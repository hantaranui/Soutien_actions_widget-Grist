<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soutenez les clubs sportifs engagés</title>

<!-- Design System France Travail (officiel) -->
<link rel="stylesheet" href="https://cdn.francetravail.fr/studio/design-system/css/styles.css">
<script src="https://cdn.francetravail.fr/webco/v1/ft-autoloader.js" fetchpriority="high"></script>

<!-- API widget Grist (instance auto-hébergée) -->
<script src="https://grist.aucarre.tech/grist-plugin-api.js"></script>

<style>
/* Mise en page du widget "Soutenez les clubs sportifs engagés".
   Les couleurs, la typographie, les rayons et les composants
   (.btn, .form-control, .modal, .alert, .badge, .progress) viennent du
   Design System France Travail (styles.css, chargé dans index.html) —
   ce fichier ne fait que composer la mise en page propre au widget avec
   les tokens documentés du DS (--ft-*, page Variables CSS) et, pour les
   points de rupture, les siens (page Espacements).

   Typographie : c'est la feuille du DS qui la fixe (page Typographie) —
   Marianne pour les titres (h1-h6, .t1-.t5, .display-*), police système
   pour le texte courant, dont les boutons et les champs héritent. Aucune
   règle font-family ici. */

* { box-sizing: border-box; }

:root {
  /* Ombre des cartes : le DS n'a pas de token d'ombre. Dérivée de celle de
     ses composants (0 0 8px rgba(15,20,56,.16)), accentuée et décalée vers
     le bas pour détacher la carte du fond clair. À valider avec l'équipe DS. */
  --lcse-card-shadow: 0 2px 12px 0 rgba(15, 20, 56, 0.22);
}

html, body {
  margin: 0;
  /* Fond clair du Design System (gray-05). Ce sont les ombres portées des
     cartes qui les détachent, pas un fond foncé. */
  background: var(--ft-color-background-neutral-weakest, #f5f5f8);
  color: var(--ft-color-text-content-default, #2e2e31);
}

/* Sur mobile, le widget est souvent affiché dans un cadre (iframe) dont la
   hauteur est fixée par Grist. Si notre page dépasse cette hauteur, iOS ne
   permet pas toujours de faire défiler l'intérieur du cadre : tout ce qui
   dépasse devient inatteignable. On force donc la page à ne jamais dépasser
   la hauteur qu'on lui donne, et c'est la zone de contenu qui défile
   elle-même (avec le défilement tactile iOS activé explicitement). */
@media (max-width: 767.98px) {
  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  .lcse-header {
    flex: 0 0 auto;
  }

  .lcse-main {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    /* Pas de -webkit-overflow-scrolling:touch ici : sur iOS il fait de
       cette zone le référentiel des éléments en position fixe, ce qui
       décrochait la modale. Le défilement fluide est natif depuis iOS 13,
       cette propriété n'apporte plus rien. */
    overscroll-behavior: contain;
  }
}

.lcse-header {
  background: var(--ft-color-background-neutral-light, #fff);
  border-bottom: 1px solid var(--ft-color-border-neutral-weak, #e6e7ec);
  padding: var(--ft-spacer-s2, 1rem) var(--ft-spacer-m2, 1.5rem);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--ft-spacer-s2, 1rem) var(--ft-spacer-m2, 1.5rem);
}

.lcse-header-logo {
  height: 40px;
  width: auto;
  max-width: 100%;
}

.lcse-header-logo-lcse {
  height: 64px;
}

@media (max-width: 480px) {
  .lcse-header { padding: var(--ft-spacer-s1, 0.75rem) var(--ft-spacer-s2, 1rem); gap: var(--ft-spacer-s1, 0.75rem) var(--ft-spacer-s2, 1rem); }
  .lcse-header-logo { height: 28px; }
  .lcse-header-logo-lcse { height: 44px; }
}

.lcse-main {
  /* width:100% : sur mobile, .lcse-main est un élément flex centré par
     margin:auto, qui se réduirait à la largeur de son contenu — les
     squelettes de chargement, sans largeur propre, s'écrasaient. */
  width: 100%;
  max-width: 1440px;
  margin: 0 auto;
  padding: var(--ft-spacer-l1, 2rem) var(--ft-spacer-m1, 1.25rem) var(--ft-spacer-l3, 3rem);
}

@media (max-width: 480px) {
  .lcse-main { padding: var(--ft-spacer-m2, 1.5rem) var(--ft-spacer-s2, 1rem) var(--ft-spacer-l2, 2.5rem); }
}

/* Chargement : squelettes aux dimensions de la page réelle (titre, bloc
   des filtres, cartes), pour que rien ne saute à l'arrivée des données. */

.lcse-skeleton-page-title {
  margin-bottom: var(--ft-spacer-l1, 2rem);
}

/* .skeleton-text:not(:last-child) du DS ajoute 0,5rem sous chaque ligne ;
   les marges ci-dessous le remplacent là où le rythme de la carte diffère
   (même spécificité que la règle du DS, notre feuille venant après). */
.lcse-loading-state .lcse-skeleton-filters {
  height: 3rem;
  margin-bottom: var(--ft-spacer-m2, 1.5rem);
  border-radius: var(--ft-radius-default, 0.75rem);
}

.lcse-card-skeleton .lcse-card-body {
  padding-bottom: var(--ft-spacer-m1, 1.25rem);
}

.lcse-loading-state .lcse-skeleton-title {
  margin: var(--ft-spacer-xs2, 0.5rem) 0 var(--ft-spacer-m1, 1.25rem);
}

.lcse-loading-state .lcse-skeleton-club {
  margin-bottom: var(--ft-spacer-s2, 1rem);
}

.lcse-skeleton-meta {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--ft-spacer-s2, 1rem);
  padding-top: var(--ft-spacer-s2, 1rem);
  margin-bottom: var(--ft-spacer-m2, 1.5rem);
  border-top: 1px solid var(--ft-color-border-neutral-weak, #e6e7ec);
}

.lcse-skeleton-meta .skeleton-text {
  margin-bottom: 0;
}

.lcse-skeleton-bar {
  height: 0.5rem; /* hauteur de .progress du DS */
}

/* Le DS anime ses squelettes sans condition : on arrête l'animation pour
   qui a demandé moins de mouvement dans ses réglages système. */
@media (prefers-reduced-motion: reduce) {
  [class^="skeleton"] {
    animation: none;
  }
}

.lcse-loading,
.lcse-error {
  padding: var(--ft-spacer-l1, 2rem) 0;
  color: var(--ft-color-text-content-weak, #5b5d65);
}

.lcse-title-row {
  display: flex;
  align-items: flex-start;
  gap: var(--ft-spacer-s2, 1rem);
  margin-bottom: var(--ft-spacer-l1, 2rem);
}

/* Filet d'accent à gauche du titre, commun aux widgets du projet : même
   bleu que celui du widget tableau de bord (#2b72ff). Token du DS le plus
   proche, à une unité près sur deux composantes (#2c74ff), pour ne pas
   coder la couleur en dur. */
.lcse-title-bar {
  width: 4px;
  align-self: stretch;
  flex: 0 0 4px;
  background: var(--ft-color-background-info-default, #2c74ff);
  border-radius: 2px;
}

.lcse-title {
  margin: 0;
  font-size: var(--ft-font-size-display-4, 1.75rem);
  font-weight: 700;
  letter-spacing: -0.01em;
}

@media (max-width: 480px) {
  .lcse-title { font-size: 1.375rem; }
}

/* Filtres : composant Collapse du Design System, variante « Filtre »
   (fond gris, taille compacte). Les champs sont des Autocomplete du DS. */

.lcse-filters {
  margin-bottom: var(--ft-spacer-m2, 1.5rem);
}

/* Le titre du bloc englobe le bouton déclencheur : on lui retire marges
   et taille de titre, le bouton du DS porte déjà son apparence. */
.lcse-filters-heading {
  margin: 0;
  font-size: inherit;
  line-height: inherit;
}

.lcse-filters-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--ft-spacer-s2, 1rem) var(--ft-spacer-m2, 1.5rem);
}

@media (max-width: 991.98px) {
  .lcse-filters-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 575.98px) {
  .lcse-filters-grid { grid-template-columns: 1fr; }
}

.lcse-filters-actions {
  margin: var(--ft-spacer-s2, 1rem) 0 0;
}

/* .btn-reset remet la marge intérieure à zéro, mais la règle .btn du DS,
   plus loin dans sa feuille, la réapplique : le lien était décalé. */
.lcse-filters-actions .btn-reset {
  padding: 0;
}

/* Onglets : composant Tabs du Design System, sans surcharge. La liste
   des actions est dans son panneau (.tab-content), qui porte la bordure
   sur laquelle l'onglet actif vient se poser. Sur petit écran, le DS fait
   défiler les onglets horizontalement plutôt que de couper les libellés. */

.lcse-tab-content {
  padding: var(--ft-spacer-m1, 1.25rem);
}

@media (max-width: 480px) {
  .lcse-tab-content { padding: var(--ft-spacer-s1, 0.75rem); }
}

/* Libellés courts sous le point de rupture « sm » du DS (576px) : en
   dessous, les libellés complets ne tiennent pas côte à côte. */
.lcse-tab-label-short { display: none; }

@media (max-width: 575.98px) {
  .lcse-tab-label-long { display: none; }
  .lcse-tab-label-short { display: inline; }
}

/* Pied de carte d'une action déjà financée : la mention remplace le
   bouton "Soutenir", sans en prendre l'apparence — ce n'est pas une
   action possible, juste un état. */
.lcse-card-financed {
  flex: 0 0 auto;
  margin: 0;
  padding: 0 var(--ft-spacer-s1, 0.75rem);
  font-size: 0.875rem;
  font-weight: 700;
  white-space: nowrap;
  color: var(--ft-color-text-primary-default, #283276);
}

.lcse-count {
  margin: 0 0 var(--ft-spacer-m1, 1.25rem);
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--ft-color-text-content-weak, #5b5d65);
}

/* Grille de cartes */

.lcse-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--ft-spacer-m1, 1.25rem);
}

@media (max-width: 1199.98px) {
  .lcse-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 767.98px) {
  .lcse-grid { grid-template-columns: 1fr; }
}

/* Pied de liste : « Charger 24 actions de plus » */

.lcse-more {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--ft-spacer-xs2, 0.5rem);
  margin-top: var(--ft-spacer-l1, 2rem);
}

.lcse-more-info {
  margin: 0;
  font-size: 0.875rem;
  color: var(--ft-color-text-content-weak, #5b5d65);
}

.lcse-card {
  background: var(--ft-color-background-neutral-light, #fff);
  border: 1px solid var(--ft-color-border-neutral-weak, #e6e7ec);
  border-radius: var(--ft-radius-default, 0.75rem);
  /* Ombre dérivée de celle du Design System France Travail (0 0 8px
     rgba(15,20,56,.16)), légèrement accentuée et décalée vers le bas pour
     bien détacher la carte sur le fond clair. */
  box-shadow: var(--lcse-card-shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.lcse-card-body {
  padding: var(--ft-spacer-m1, 1.25rem) var(--ft-spacer-m1, 1.25rem) 0;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.lcse-card-top {
  display: flex;
  gap: var(--ft-spacer-s2, 1rem);
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: var(--ft-spacer-m1, 1.25rem);
}

.lcse-card-heading {
  /* Sans ça, un flex item contenant du texte refuse de rétrécir sous sa
     largeur "naturelle" et peut déborder sur un écran étroit. Ciblé par
     classe (pas par `.lcse-card-top > div`) pour ne jamais accrocher
     .lcse-card-photo, qui est aussi une div enfant directe. */
  flex: 1 1 auto;
  min-width: 0;
}

.lcse-card-date {
  margin: 0 0 var(--ft-spacer-xs2, 0.5rem);
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ft-color-text-primary-default, #283276);
}

.lcse-card-title {
  /* tabindex="-1" : focalisable par script (après « Charger … de plus »),
     hors de l'ordre de tabulation. */
  scroll-margin-top: var(--ft-spacer-m2, 1.5rem);
  margin: 0;
  font-size: 1.125rem;
  font-weight: 700;
  letter-spacing: -0.005em;
  line-height: 1.3;
}

.lcse-card-photo {
  flex: 0 0 88px;
  width: 88px;
  height: 66px;
  border-radius: 0.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.6875rem;
  color: var(--ft-color-text-content-weak, #5b5d65);
  overflow: hidden;
}

/* Cadre + fond uniquement tant qu'il n'y a pas de logo à afficher */
.lcse-card-photo:not(:has(img)) {
  border: 1px solid var(--ft-color-border-neutral-weak, #e6e7ec);
  background: var(--ft-color-background-neutral-weakest, #f5f5f8);
}

.lcse-card-photo img {
  width: 100%;
  height: 100%;
  object-fit: contain; /* logo de club : on veut le voir en entier, pas le rogner comme une photo */
  padding: var(--ft-spacer-xs1, 0.25rem);
}

.lcse-card-club {
  margin: 0 0 var(--ft-spacer-s1, 0.75rem);
  font-size: 1rem;
  font-weight: 700;
  color: var(--ft-color-text-primary-default, #283276);
}

.lcse-card-meta {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--ft-spacer-s1, 0.75rem) var(--ft-spacer-s2, 1rem);
  margin: 0 0 var(--ft-spacer-m1, 1.25rem);
  padding-top: var(--ft-spacer-s2, 1rem);
  border-top: 1px solid var(--ft-color-border-neutral-weak, #e6e7ec);
}

/* Hors points de rupture du DS : à 480px, les métadonnées passeraient
   sur une colonne dès les téléphones courants (390px), où deux colonnes
   tiennent encore. */
@media (max-width: 380px) {
  .lcse-card-meta { grid-template-columns: 1fr; }
}

.lcse-card-meta dt {
  font-size: 0.6875rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ft-color-text-content-weak, #5b5d65);
  margin-bottom: var(--ft-spacer-xxs, 0.125rem);
}

.lcse-card-meta dd {
  margin: 0;
  font-size: 0.9375rem;
  font-weight: 600;
}

.lcse-card-footer {
  display: flex;
  align-items: center;
  gap: var(--ft-spacer-s1, 0.75rem) var(--ft-spacer-m1, 1.25rem);
  flex-wrap: wrap;
  margin-top: auto;
  margin-bottom: var(--ft-spacer-m1, 1.25rem);
}

/* Le bouton garde sa largeur naturelle (flex-grow:0) : il ne s'étire plus
   pour égaler la jauge, qui récupère toute la place restante. Le
   remplissage horizontal est resserré à la valeur des boutons compacts du
   Design System (0,75rem) au lieu de celle des boutons
   normaux (1rem), pour ne pas laisser de vide de part et d'autre de
   « Soutenir » — la hauteur, elle, reste celle d'un bouton normal
   (2,5rem), suffisante au doigt. */
.lcse-card-footer .btn {
  flex: 0 0 auto;
  padding: 0 var(--ft-spacer-s1, 0.75rem);
  /* 14px, comme le bouton du design de référence (Page de soutien.dc.html) :
     le Design System met 16px par défaut, ce qui élargissait le bouton
     d'une vingtaine de pixels sans rien apporter. */
  font-size: 0.875rem;
  white-space: nowrap;
}

/* flex-basis à 0 (et non auto) : la largeur naturelle du libellé de la
   jauge n'entre pas dans le calcul du retour à la ligne, donc le bouton
   reste à côté de la jauge au lieu de passer sous elle sur les cartes
   étroites (grille à trois colonnes). La jauge prend tout le reste. */
.lcse-card-progress { flex: 1 1 0; min-width: 0; }

/* Après les règles de base, sinon `flex: 1 1 0` ci-dessus écraserait ce
   flex-basis (une media query n'ajoute pas de spécificité, c'est l'ordre
   qui tranche — l'empilement de la jauge ne fonctionnait pas). */
/* 420px : hors points de rupture du DS. Au point le plus proche (480px),
   le bouton passerait sous la jauge jusqu'à 480px alors qu'il tient à
   côté d'elle dès 421px. */
@media (max-width: 420px) {
  /* En dessous de cette largeur, la jauge prend toute la ligne et le
     bouton passe en dessous. Il garde sa largeur naturelle : l'étirer à
     100% (ce que faisait cette règle) donnait un bouton pleine largeur
     qui écrasait tous les réglages de taille ci-dessus. margin-left:auto
     le pousse à droite, comme dans la disposition large. */
  .lcse-card-progress { flex-basis: 100%; }
  .lcse-card-footer .btn { margin-left: auto; }
}

.lcse-card-progress {
  /* Couleur de la barre par la variable prévue par le DS : bleu primaire
     plutôt que son bleu décoratif par défaut, pour rester dans la couleur
     du bouton « Soutenir » voisin. */
  --ft--progressbar-bg-color: var(--ft-color-background-primary-default, #283276);
  /* Le DS espace libellé et barre de 0,75rem : resserré, la jauge se lit
     comme un seul bloc à côté du bouton. */
  row-gap: var(--ft-spacer-xs2, 0.5rem);
}

.lcse-card-progress .progress-label {
  /* 14px comme la référence : c'est le montant cofinancé, l'information
     que la carte doit mettre en avant ; en 16px, libellé et pourcentage
     ne tiendraient plus sur une ligne dans la grille à trois colonnes. */
  font-size: var(--ft-font-size-text-small, 0.875rem);
  font-weight: 600;
  column-gap: var(--ft-spacer-s1, 0.75rem);
}

/* Modale de soutien (modale centrée .modal-lg du Design System) */

.modal-backdrop.show,
.lcse-modal.show {
  display: block;
}

/* Le Design System attend que .modal-body et .modal-footer soient des
   enfants DIRECTS de .modal-content pour que sa mise en page flex
   (entête / corps qui défile / pied de page fixe, via
   .modal-dialog-scrollable) fonctionne. Notre <form> — nécessaire pour
   la soumission — casse cette chaîne ; display:contents le fait
   disparaître de la boîte de mise en page sans perdre son rôle
   fonctionnel, comme si .modal-body/.modal-footer étaient directement
   dans .modal-content. */
#lcse-support-form {
  display: contents;
}

/* Même piège flexbox classique que d'habitude : sans min-height:0, .modal-body
   (flex:1 1 auto côté DS) refuse de rétrécir sous la hauteur naturelle de
   son contenu et empêche le pied de page d'être visible sur un écran bas. */
.lcse-modal .modal-body {
  min-height: 0;
}

/* Entête : .modal-header du DS (titre à gauche, bouton de fermeture à
   droite), sur fond bleu clair. */
.lcse-modal .lcse-modal-header {
  gap: var(--ft-spacer-s2, 1rem);
  padding: var(--ft-spacer-m1, 1.25rem) var(--ft-spacer-m2, 1.5rem);
  background: var(--ft-color-background-primary-weakest, #eaecfb);
}

.lcse-modal-heading {
  flex: 1 1 auto;
  min-width: 0;
}

.lcse-modal-kicker {
  margin: 0 0 var(--ft-spacer-xs1, 0.25rem);
  font-size: var(--ft-font-size-text-xsmall, 0.75rem);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ft-color-text-primary-default, #283276);
}

.lcse-modal-meta {
  margin: var(--ft-spacer-xxs, 0.125rem) 0 0;
  font-size: var(--ft-font-size-text-small, 0.875rem);
  color: var(--ft-color-text-content-weak, #5b5d65);
}

.lcse-modal .modal-body.lcse-form-body,
.lcse-modal .modal-body.lcse-sent-body {
  padding-top: var(--ft-spacer-m2, 1.5rem);
}

.lcse-form-note {
  margin: 0 0 var(--ft-spacer-s2, 1rem);
  font-size: var(--ft-font-size-text-small, 0.875rem);
  color: var(--ft-color-text-content-weak, #5b5d65);
}

/* Champs par paires. Deux colonnes dans la modale centrée (large de
   800px au plus) : quatre lignes au lieu de sept, la modale tient sans
   ascenseur. Les champs gardent
   l'échelle du Design System (libellé 16px, champ 40px). */
.lcse-form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: var(--ft-spacer-s2, 1rem);
}

.lcse-form-full {
  grid-column: 1 / -1;
}

/* Le DS n'affiche le message d'erreur que s'il suit directement le champ
   (.is-invalid ~ .invalid-feedback). Pour le Montant, le champ est dans un
   .input-group : on rattache donc l'affichage au groupe en erreur. */
.lcse-modal .has-error .invalid-feedback {
  display: block;
}

/* Le DS remet .form-group à margin-bottom:0 dans une règle ultérieure ;
   on refixe donc l'écart entre deux champs explicitement. */
.lcse-modal .form-group {
  margin-bottom: var(--ft-spacer-s2, 1rem);
}

/* Sur mobile, les deux présentations occupent toute la zone du widget
   plutôt que d'être centrées verticalement : centrée, la modale se
   positionne au milieu du cadre, qui peut être plus haut que ce que
   l'écran affiche réellement — d'où un titre coupé en haut. Ancrée en
   haut et en pleine hauteur, elle est toujours entièrement visible. */
@media (max-width: 767.98px) {
  .lcse-modal .modal-dialog {
    width: 100%;
    max-width: 100%;
    min-width: 0;
    height: 100%;
    max-height: 100%;
    margin: 0;
    align-items: stretch;
  }

  .lcse-modal .modal-content {
    height: 100%;
    max-height: 100%;
    border-radius: 0;
    border: 0;
  }

  .lcse-form-grid {
    grid-template-columns: minmax(0, 1fr);
  }

/* ---- src/logic.js ---- */
/*

(function (root) {

    dr: "DR",
    dd: "DD",

    federations: "Federations",
    cofinancements: "Cofinancements",

  // recherche à la frappe (Autocomplete du DS) plutôt qu'une liste
  // déroulante (Select), réservé à la liste des clubs, la seule longue.

    { key: "region", label: "Région" },
    { key: "dept", label: "Département" },
    { key: "fede", label: "Fédération" },
    { key: "club", label: "Club", search: true },
  ];

  // du widget (trouver une action à cofinancer) ; TAB_FUNDED sert à montrer
  // ce qui a abouti, sans polluer la liste utile.
  const TAB_OPEN = "a-soutenir";
  const TAB_FUNDED = "financees";
  // shortLabel : libellé affiché sur petit écran, où les deux libellés
  // complets ne tiennent pas côte à côte (le second onglet serait coupé).
  const TABS = [
    { key: TAB_OPEN, label: "Actions à soutenir", shortLabel: "À soutenir" },
    { key: TAB_FUNDED, label: "Actions déjà financées", shortLabel: "Déjà financées" },
  ];

  // Nombre d'actions affichées d'emblée, et taille de chaque lot ajouté
  // ensuite par le bouton « Charger 24 actions de plus ». Toutes les
  // actions restent chargées en mémoire : on ne limite que ce qui est
  // effectivement rendu dans le DOM (et donc les logos à télécharger),
  // ce qui est le poste de coût réel à l'affichage.
  const PAGE_SIZE = 24;

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));

  // insécable (U+202F), pas une espace normale : on la remplace par une
  // espace normale pour un rendu/copier-coller plus prévisible.
  // Espaces insécables (U+00A0) : ni entre les milliers ni avant « € » la
  // ligne ne doit se couper (« 5 / 000 € »). Pas l'espace fine U+202F que
  // produit toLocaleString, mal restituée au copier-coller et par certaines
  // polices.

  }

  // Fuseau fixé à Europe/Paris : ces dates sont celles d'actions en France
  // et doivent s'afficher pareil pour tout le monde, quel que soit le
  // fuseau du navigateur du visiteur (ou de la machine qui exécute les
  // tests).

    const d = new Date(ts * 1000);

  function filterOptionsByQuery(options, query) {

   * valeur : on vient chercher un autre choix.

    const drMap = indexById(rowsFromColumnTable(drT));
    const ddMap = indexById(rowsFromColumnTable(ddT));
    const structureMap = indexById(rowsFromColumnTable(structuresT));
    const federationMap = indexById(rowsFromColumnTable(federationsT));
    const cofinRows = rowsFromColumnTable(cofinT);

        const publicLabels = unpackList(a.Public);

        return {

          intitule: a.Intitule || "(sans titre)",
          financee: pct >= 100,
          ouvertAuFinancement: isOuvertAuFinancement(a.Ouvert_au_financement),
          statut: a.Statut || "",
          dateLabel: dateLabelFor(a),
          dateTs: dateTsOf(a),
          clubLabel: structure ? structure.Nom : "Club non renseigné",
          villeLabel: villeLabelFor(a),
          federationLabel: federation ? federation.Nom : "Non précisée",
          regionLabel: dr ? dr.Nom : "",
          deptLabel: dd ? dd.Nom : "",

   * Découpe la liste filtrée en une page cumulative : les `visibleCount`
   * premières actions. Fonction pure, indépendante du DOM.
   *
   * @param {Array} list actions déjà filtrées, dans l'ordre d'affichage.
   * @param {number} visibleCount nombre d'actions à afficher.
   * @param {number} [pageSize=PAGE_SIZE] taille du prochain lot.
   * @returns {{page:Array, shown:number, total:number, remaining:number, nextBatch:number}}
   */
  function paginate(list, visibleCount, pageSize) {
    const size = Number(pageSize) > 0 ? Number(pageSize) : PAGE_SIZE;
    const total = list.length;
    const shown = Math.max(0, Math.min(Number(visibleCount) || 0, total));
    const remaining = total - shown;
    return {
      page: list.slice(0, shown),
      shown,
      total,
      remaining,
      nextBatch: Math.min(size, remaining),

   * une action non financée mais non ouverte n'est proposée nulle part —

  function actionsForTab(actions, tab) {

    return actions.filter((a) => !a.financee && !!a.ouvertAuFinancement);

  // "ouverte au soutien" n'ayant aucun sens pour une action déjà financée.
  function countLabelFor(tab, n) {
    if (tab === TAB_FUNDED) {
      if (n === 0) return "Aucune action financée à 100 %";
      return n === 1 ? "1 action financée à 100 %" : `${n} actions financées à 100 %`;
    }
    if (n === 0) return "Aucune action ouverte au soutien";
    return n === 1 ? "1 action ouverte au soutien" : `${n} actions ouvertes au soutien`;
  }

  // région choisie ; fédération et club restent globaux (comportement du

    const inRegion = state.region === ALL ? actions : actions.filter((a) => a.regionLabel === state.region);
    return {
      region: [ALL, ...uniqSorted(actions.map((a) => a.regionLabel))],
      dept: [ALL, ...uniqSorted(inRegion.map((a) => a.deptLabel))],
      fede: [ALL, ...uniqSorted(actions.map((a) => a.federationLabel))],
      club: [ALL, ...uniqSorted(actions.map((a) => a.clubLabel))],

  // Formulaire de soutien : validation
  // ---------------------------------------------------------------------

    if (!v("nom")) errors.nom = "Renseignez votre nom.";

  const api = {
    ALL,
    TABLES,
    FILTER_KEYS,
    FILTERS,
    filterSuggestions,
    activeFilterCount,
    PAGE_SIZE,
    TABS,
    TAB_OPEN,
    TAB_FUNDED,
    escapeHtml,
    eur,
    formatDateFr,
    unpackList,
    uniqSorted,
    filterOptionsByQuery,
    rowsFromColumnTable,
    indexById,

    return `
      <div class="lcse-card lcse-card-skeleton">
        <div class="lcse-card-body">
          <div class="skeleton-text w-25"></div>
          <div class="skeleton-h2 w-75 lcse-skeleton-title"></div>
          <div class="skeleton-text w-50 lcse-skeleton-club"></div>
          <div class="lcse-skeleton-meta">
            <div class="skeleton-text"></div><div class="skeleton-text"></div>
            <div class="skeleton-text"></div><div class="skeleton-text"></div>
          </div>
          <div class="skeleton-text w-50"></div>
          <div class="skeleton-text lcse-skeleton-bar"></div>
        </div>
      </div>`;
  }

  /**
   * État de chargement : squelettes du Design System (exemple de code
   * « Skeleton · Card ») à la place du texte seul. Les squelettes sont
   * masqués aux lecteurs d'écran (aria-hidden, comme dans l'exemple) ; un
   * message de statut leur dit ce qui se passe (RGAA 7.5).
   *
   * @param {number} cards nombre de cartes fantômes.
   */
  function renderLoadingState(cards) {
    return `
    <div class="lcse-loading-state">
      <p class="sr-only" role="status">Chargement des actions…</p>
      <div aria-busy="true" aria-hidden="true">
        <div class="skeleton-h1 w-50 lcse-skeleton-page-title"></div>
        <div class="skeleton-text lcse-skeleton-filters"></div>
        <div class="lcse-grid">${Array.from({ length: cards }, renderCardSkeleton).join("")}
        </div>
      </div>
    </div>`;
  }

  function renderEmptyState() {
    return `
    <div class="alert alert-info" role="status">
      <div class="alert-body">
        <p class="alert-title">Aucune action sur ce périmètre</p>
        <p class="alert-content">Élargissez la sélection pour voir les actions des territoires voisins.</p>
      </div>
    </div>`;
  }

  /**
   * Jauge de cofinancement. Même balisage que le rendu interne du
   * webcomponent <ft-progressbar> du Design System (.progressbar-container,
   * .progress-label, .progress-percent, .progress, .progress-bar), sans le
   * webcomponent lui-même : celui-ci charge la feuille complète du DS dans
   * le Shadow DOM de chaque jauge (jusqu'à 24 par liste, à chaque rendu) et
   * sa barre role="progressbar" n'a pas de nom accessible.
   *
   * L'information passe par le texte (libellé + pourcentage), lu par les
   * lecteurs d'écran ; la barre, purement visuelle, leur est masquée.
   *
   * @param {string} label ex. « 1 000 € cofinancés sur 5 000 € »
   * @param {number} pct pourcentage entier, 0 à 100.
   * @param {boolean} [showPercent=true] false pour une action financée :
   *   la mention « Financée à 100 % » à côté le dit déjà.
   */
  function renderProgress(label, pct, showPercent = true) {
    const percent = showPercent
      ? `<strong class="progress-percent">${pct}&nbsp;%<span class="sr-only">&nbsp;financé</span></strong>`
      : "";
    return `
          <div class="progressbar-container lcse-card-progress">
            <p class="progress-label"><span>${escapeHtml(label)}</span>${percent}</p>
            <div class="progress" aria-hidden="true"><div class="progress-bar" style="width:${pct}%"></div></div>
          </div>`;
  }

  function renderCard(a) {
    return `
    <article class="lcse-card">
      <div class="lcse-card-body">
        <div class="lcse-card-top">
          <div class="lcse-card-heading">
            <p class="lcse-card-date">${escapeHtml(a.dateLabel)}</p>
            <h2 class="lcse-card-title" id="lcse-card-${a.id}-title" tabindex="-1">${escapeHtml(a.intitule)}</h2>
          </div>
          ${a.photoUrl ? `<div class="lcse-card-photo"><img src="${escapeHtml(a.photoUrl)}" alt="" loading="lazy" decoding="async" onerror="this.closest('.lcse-card-photo').remove()"></div>` : ""}
        </div>

        <p class="lcse-card-club">${escapeHtml(a.clubLabel)}</p>

        <dl class="lcse-card-meta">
          <div>
            <dt>Ville</dt>
            <dd>${escapeHtml(a.villeLabel)}</dd>
          </div>
          <div>
            <dt>Fédération</dt>
            <dd>${escapeHtml(a.federationLabel)}</dd>
          </div>
          <div>
            <dt>Participants</dt>
            <dd>${escapeHtml(a.participantsLabel)}</dd>
          </div>
          <div>
            <dt>Public</dt>
            <dd>${escapeHtml(a.publicLabel)}</dd>
          </div>
        </dl>

        <div class="lcse-card-footer">
          ${renderProgress(a.collecteLabel, a.pct, !a.financee)}
          ${a.financee
            // Proposer de cofinancer une action déjà bouclée n'a pas de
            // sens : le bouton laisse place à la mention du résultat.
            ? `<p class="lcse-card-financed">Financée à 100 %</p>`
            // Libellé court pour laisser la place à la jauge ; aria-label
            // redonne le contexte aux lecteurs d'écran, qui annoncent
            // souvent les boutons hors de leur carte.
            : `<button type="button" class="btn btn-primary" data-action="support" data-id="${a.id}" aria-label="Soutenir cette action : ${escapeHtml(a.intitule)}">Soutenir</button>`}
        </div>
      </div>
    </article>`;
  }

  // Id du bouton d'un onglet : sert au retour du focus après un rendu et
  // au lien d'évitement « Retour à l'onglet actif ».
  function tabButtonId(key) {
    return `lcse-tab-${key}`;
  }

  /**
   * Les deux onglets, avec le nombre d'actions que chacun contient sous
   * les filtres courants — pour qu'on sache ce qu'on trouvera en face
   * avant de cliquer.
   *
   * Balisage de l'exemple de code « Tabs · Défaut » du Design System :
   * une simple liste de boutons dans <nav role="presentation">, onglet
   * courant en .active + aria-current="true". Pas de role="tab" : ce motif
   * ARIA impose une navigation aux flèches que le DS ne prévoit pas, et le
   * déclarer sans elle trompe les lecteurs d'écran (RGAA 7.1).
   *
   * @param {Array<{key:string,label:string,shortLabel?:string}>} tabs
   * @param {string} activeKey
   * @param {Object<string,number>} counts nombre d'actions par clé d'onglet.
   */
  function renderTabs(tabs, activeKey, counts) {
    const items = tabs.map((t) => {
      const active = t.key === activeKey;
      const n = counts[t.key] || 0;
      return `
        <li class="nav-item">
          <button type="button" id="${tabButtonId(escapeHtml(t.key))}" class="nav-link${active ? " active" : ""}" data-tab="${escapeHtml(t.key)}"${active ? ' aria-current="true"' : ""}>
            <span class="nav-link-text">${t.shortLabel
              // Un seul des deux libellés est affiché (display), donc lu.
              ? `<span class="lcse-tab-label-long">${escapeHtml(t.label)}</span><span class="lcse-tab-label-short">${escapeHtml(t.shortLabel)}</span>`
              : escapeHtml(t.label)}&nbsp;(${n})</span>
          </button>
        </li>`;
    }).join("");

    return `
    <nav role="presentation" class="lcse-tabs">
      <ul class="nav nav-tabs">${items}
      </ul>
    </nav>`;
  }

  /**
   * Panneau de l'onglet actif (.tab-content > .tab-pane.active du DS). Un
   * seul panneau : son contenu est recalculé à chaque changement d'onglet.
   * Il se termine par le lien d'évitement de l'exemple de code du DS, qui
   * ramène le clavier à l'onglet actif après une longue liste.
   *
   * @param {string} activeKey
   * @param {string} contentHtml
   */
  function renderTabPane(activeKey, contentHtml) {
    const key = escapeHtml(activeKey);
    return `
    <div class="tab-content lcse-tab-content">
      <div class="tab-pane active" id="lcse-tab-${key}-content">
        ${contentHtml}
        <div class="position-relative">
          <a href="#${tabButtonId(key)}" class="skip-link sr-only sr-only-focusable" data-action="back-to-tab">Retour à l'onglet actif</a>
        </div>
      </div>
    </div>`;
  }

  /**
   * Pied de liste : rappel du nombre d'actions affichées et bouton
   * d'ajout du lot suivant. Rien n'est rendu quand tout est déjà affiché.
   *
   * @param {{shown:number, total:number, remaining:number, nextBatch:number}} p
   *   tel que renvoyé par logic.paginate.
   */
  function renderLoadMore(p) {
    if (p.remaining <= 0) return "";
    const actionsWord = p.nextBatch === 1 ? "action" : "actions";
    return `
    <div class="lcse-more">
      <p class="lcse-more-info">${p.shown} actions affichées sur ${p.total}</p>
      <button type="button" class="btn btn-secondary" data-action="load-more">
        Charger ${p.nextBatch} ${actionsWord} de plus
      </button>
    </div>`;
  }

  // Options d'un filtre en liste déroulante. La valeur retenue est ajoutée
  // si elle manque (elle peut ne plus figurer parmi les options de l'onglet
  // courant) : sans cela, le navigateur afficherait la première option.
  function renderFilterOptions(options, selected) {
    const list = options.includes(selected) ? options : [selected, ...options];
    return list
      .map((o) => `<option value="${escapeHtml(o)}"${o === selected ? " selected" : ""}>${escapeHtml(o)}</option>`)
      .join("");
  }

  // Un filtre.
  //  - Liste déroulante : composant Select du Design System (exemple de
  //    code « Select · Défaut »), un <select> natif.
  //  - Avec recherche (f.search) : composant Autocomplete du Design System
  //    (exemple « Autocomplete · Défaut »). Le webcomponent
  //    <ft-autocomplete> gère la liste, les flèches, les attributs ARIA,
  //    l'annonce du nombre de résultats et le bouton d'effacement ; main.js
  //    lui fournit les suggestions (searchCallback) et écoute le choix
  //    (ft-autocomplete-change).
  function renderFilter(f, value, options) {
    const key = f.key;
    const label = f.label;
    const id = `lcse-filter-${key}`;
    if (!f.search) {
      return `
        <div class="lcse-filter">
          <label class="form-label" for="${id}">${escapeHtml(label)}</label>
          <select class="form-control" data-filter="${key}" id="${id}" name="${key}">${renderFilterOptions(options || [], value)}</select>
        </div>`;
    }
    return `
        <div class="autocomplete">
          <label class="form-label" for="${id}">${escapeHtml(label)}</label>
          <div class="form-control-wrapper">
            <input class="form-control autocomplete-input" data-autocomplete="true" data-filter="${key}" id="${id}" name="${key}" placeholder=" " type="text" autocomplete="off" value="${escapeHtml(value)}">
            <ft-autocomplete input-id="${id}" label-property="name"></ft-autocomplete>
          </div>
        </div>`;
  }

  // Pastille du nombre de filtres actifs, dans le déclencheur du bloc
  // (exemple « Collapse · Filtre »). Rien quand aucun filtre n'est actif.
  function renderFilterBadge(count) {
    if (!count) return "";
    return `<span class="badge badge-neutral">${count}<span class="sr-only">&nbsp;${count > 1 ? "filtres actifs" : "filtre actif"}</span></span>`;
  }

  /**
   * Bloc des filtres : composant Collapse du Design System, variante
   * « Filtre » (.ds-collapse.ds-collapse-sm.ds-collapse-filter). La
   * directive data-ft-collapse ouvre et ferme le bloc et tient à jour
   * aria-expanded / aria-controls : main.js ne le redessine jamais.
   *
   * @param {Array<{key:string,label:string,search?:boolean}>} filters
   * @param {Object<string,string>} values valeur retenue par filtre.
   * @param {number} activeCount
   * @param {boolean} open état d'ouverture initial.
   * @param {Object<string,string[]>} options options des listes déroulantes.
   */
  function renderFilters(filters, values, activeCount, open, options) {
    return `
    <div class="ds-collapse ds-collapse-sm ds-collapse-filter lcse-filters">
      <h2 class="lcse-filters-heading">
        <button class="ds-collapse-trigger is-rotating" data-ft-collapse="lcse-filters-panel" id="lcse-filters-trigger" type="button">
          <span class="ds-collapse-trigger-content">Filtres</span><span class="ds-collapse-trigger-content-append" id="lcse-filters-count">${renderFilterBadge(activeCount)}</span>
          <span aria-hidden="true" class="icon icon-chevron-sm-d"></span>
        </button>
      </h2>
      <div id="lcse-filters-panel"${open ? ' class="open"' : ""}>
        <div class="ds-collapse-content"${open ? "" : " hidden"}>
          <div class="lcse-filters-grid">${filters.map((f) => renderFilter(f, values[f.key], (options || {})[f.key])).join("")}
          </div>
          <p class="lcse-filters-actions">
            <button type="button" class="btn btn-reset text-link" data-action="reset">Réinitialiser les filtres</button>
          </p>
        </div>
      </div>
    </div>`;
  }

  // Entête commune aux deux panneaux de la modale (formulaire, envoi
  // confirmé) : structure .modal-header du Design System, avec son bouton
  // de fermeture (présent sur toutes les démos Modal et Modal side du DS) :
  // on doit pouvoir quitter la modale autrement qu'en validant. Le titre
  // porte l'id visé par aria-labelledby.
  function renderModalHeader(title, kicker, meta) {
    return `
    <div class="modal-header lcse-modal-header">
      <div class="lcse-modal-heading">
        ${kicker ? `<p class="lcse-modal-kicker">${escapeHtml(kicker)}</p>` : ""}
        <h2 class="modal-title" id="lcse-modal-title">${escapeHtml(title)}</h2>
        ${meta ? `<p class="lcse-modal-meta">${escapeHtml(meta)}</p>` : ""}
      </div>
      <button type="button" id="lcse-modal-close" class="btn-ratio-square btn btn-reset close" data-action="close">
        <span aria-hidden="true" class="icon icon-close"></span>
        <span class="sr-only">Fermer la fenêtre</span>
      </button>
    </div>`;
  }

  function renderSentPanel(action) {
    return `
    ${renderModalHeader("Demande transmise")}
    <div class="modal-body lcse-sent-body">
      <p>La structure porteuse de « ${escapeHtml(action.intitule)} » vous répondra sous cinq jours ouvrés. Une copie de votre demande a été adressée au référent France Travail du territoire.</p>
    </div>
    <div class="modal-footer">
      <button type="button" id="lcse-sent-close" class="btn btn-secondary" data-action="close"><span class="btn-content">Fermer</span></button>
    </div>`;
  }

  // Champs du formulaire de soutien, dans l'ordre d'affichage (le même
  // que logic.SUPPORT_FIELDS). Balisage calqué sur les exemples de code
  // Input du Design System : Défaut, Aide (help), Erreur, Email, Téléphone,
  // Numérique et Append (unité accolée au champ).
  const SUPPORT_FORM_FIELDS = [
    { name: "prenom", label: "Prénom", required: true, attrs: 'autocomplete="given-name"' },
    { name: "nom", label: "Nom", required: true, attrs: 'autocomplete="family-name"' },
    { name: "organisation", label: "Organisation", required: true, attrs: 'autocomplete="organization"',
      help: "Entreprise, collectivité ou association qui apporte le soutien." },
    { name: "email", label: "Adresse électronique", required: true,
      attrs: 'type="email" autocomplete="email" autocapitalize="none" autocorrect="off"',
      help: "Exemple : nom@organisation.fr" },
    { name: "telephone", label: "Téléphone", attrs: 'type="tel" inputmode="tel" autocomplete="tel-national"',
      help: "Exemple : 0102030405" },
    { name: "montant", label: "Montant envisagé", unit: "€", unitSr: "en euros",
      attrs: 'type="text" inputmode="numeric"' },
    { name: "message", label: "Message", textarea: true, full: true,
      help: "Précisez la nature du soutien : financement, matériel, mécénat de compétences." },
  ];

  // Un champ du formulaire, avec son éventuel message d'erreur.
  //
  // Erreur (exemple Input · Erreur) : .has-error sur le groupe,
  // .is-invalid + aria-invalid sur le champ, message .invalid-feedback
  // préfixé de « Erreur : » pour les lecteurs d'écran, relié au champ par
  // aria-describedby — comme le message d'aide, qu'il précède.
  function renderSupportField(f, error) {
    const id = `f-${f.name}`;
    const errorId = `error-${id}`;
    const helpId = `help-${id}`;
    const describedBy = [error ? errorId : "", f.help ? helpId : ""].filter(Boolean).join(" ");
    const fieldAttrs = [
      `id="${id}"`,
      `name="${f.name}"`,
      `class="form-control${error ? " is-invalid" : ""}"`,
      f.attrs || "",
      f.required ? "required" : "",
      describedBy ? `aria-describedby="${describedBy}"` : "",
      error ? 'aria-invalid="true"' : "",
    ].filter(Boolean).join(" ");

    const control = f.textarea
      ? `<textarea ${fieldAttrs} rows="3"></textarea>`
      : `<input ${fieldAttrs}>`;

    return `
          <div class="form-group${f.full ? " lcse-form-full" : ""}${error ? " has-error" : ""}">
            <label class="form-label" for="${id}">${f.label}${f.unitSr ? `<span class="sr-only">&nbsp;${f.unitSr}</span>` : ""}${f.required ? '<span class="required">&nbsp;*</span>' : ""}</label>
            ${f.unit ? `<div class="input-group">
              ${control}
              <div class="input-group-append" aria-hidden="true"><span class="input-group-text">${f.unit}</span></div>
            </div>` : control}
            ${error ? `<p class="help-block invalid-feedback" id="${errorId}"><span class="sr-only">Erreur&nbsp;:&nbsp;</span>${escapeHtml(error)}</p>` : ""}
            ${f.help ? `<p class="help-block" id="${helpId}">${f.help}</p>` : ""}
          </div>`;
  }

  // uiState: { submitting: boolean, submitError: string,
  //            fieldErrors: { [champ]: message } }
  //
  // Les champs sont groupés par paires (.lcse-form-grid) : deux colonnes,
  // pour que la modale tienne sans ascenseur ; une seule sur mobile.
  // L'ordre du HTML reste l'ordre de lecture dans les deux cas.
  //
  // novalidate : les erreurs sont affichées par le widget au format du
  // Design System, pas par les bulles du navigateur. Les attributs
  // required restent, pour que les lecteurs d'écran annoncent le caractère
  // obligatoire.
  //
  // L'alerte d'échec d'envoi est toujours présente, masquée et vide : main.js
  // y écrit le message après le rendu. Une zone role="alert" créée avec son
  // texte déjà dedans n'est pas annoncée par tous les lecteurs d'écran.
  function renderFormPanel(action, uiState) {
    const fieldErrors = uiState.fieldErrors || {};
    return `
    ${renderModalHeader(action.intitule, "Soutenir une action", `${action.villeLabel} · ${action.federationLabel}`)}
    <form id="lcse-support-form" novalidate>
      <div class="modal-body lcse-form-body">
        <p class="lcse-form-note">Les champs marqués d'un <span class="required">*</span> sont obligatoires.</p>
        <div class="alert alert-error lcse-submit-alert" id="lcse-submit-alert" role="alert" hidden>
          <div class="alert-body"><p class="alert-content" id="lcse-submit-alert-text"></p></div>
        </div>
        <div class="lcse-form-grid">
          ${SUPPORT_FORM_FIELDS.map((f) => renderSupportField(f, fieldErrors[f.name])).join("")}
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id="lcse-cancel" class="btn btn-secondary" data-action="close"><span class="btn-content">Annuler</span></button>
        ${uiState.submitting
          // Bouton avec spinner (exemple Button · Loader). aria-disabled
          // plutôt que disabled : le bouton garde le focus pendant l'envoi.
          ? `<button type="submit" id="lcse-submit" class="btn btn-primary" aria-disabled="true"><span class="btn-content">Envoi en cours</span><ft-spinner class="icon" label="Envoi en cours" size="xs"></ft-spinner></button>`
          : `<button type="submit" id="lcse-submit" class="btn btn-primary"><span class="btn-content">Envoyer</span></button>`}
      </div>
    </form>`;
  }

  // action: l'action ouverte, ou null si la modale est fermée.
  function renderModal(action, uiState) {
    const open = !!action;
    return `
    <div class="modal-backdrop ${open ? "show" : ""}" data-action="close" ${open ? "" : "hidden"}></div>
    <div class="modal lcse-modal ${open ? "show" : ""}" role="dialog" aria-modal="true" aria-labelledby="lcse-modal-title" tabindex="-1" ${open ? "" : "hidden"}>
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
        <div class="modal-content">
          ${!open ? "" : uiState.sent ? renderSentPanel(action) : renderFormPanel(action, uiState)}
        </div>
      </div>
    </div>`;
  }

  return {
    renderEmptyState,
    renderLoadingState,
    renderCard,
    renderProgress,
    renderTabs,
    renderTabPane,
    tabButtonId,
    renderLoadMore,
    renderFilter,
    renderFilterOptions,
    renderFilterBadge,
    renderFilters,
    renderModal,
    renderSentPanel,
    renderFormPanel,
    renderSupportField,
    SUPPORT_FORM_FIELDS,
  };
});


/* ---- src/main.js ---- */
/*
 * Point d'entrée du widget : câblage avec l'API Grist et le DOM. Tout ce
 * qui est calcul pur vit dans logic.js, tout ce qui est gabarit HTML vit
 * dans render.js — ce fichier ne fait que les appeler et gérer l'état
 * mutable (filtres, modale) et les événements DOM.
 *
 * Chargé après logic.js et render.js (voir index.html) : `LCSE` est déjà
 * peuplé quand ce script s'exécute.
 */
(function () {
  "use strict";

  const {
    ALL, TABLES, PAGE_SIZE, TABS, TAB_OPEN,
    getFilterOptions, buildActions, paginate, actionsForTab, countLabelFor,
    SUPPORT_FIELDS, parseMontant, validateSupportForm, FILTERS,
    filterSuggestions, activeFilterCount,
  } = window.LCSE;
  const {
    renderEmptyState, renderLoadingState, renderCard, renderTabs, renderTabPane, tabButtonId,
    renderLoadMore, renderFilters, renderFilterBadge, renderFilterOptions,
    renderModal,
  } = window.LCSE;

  // --- Accès aux pièces jointes (logos) ---------------------------------
  //
  // Les tables arrivent par l'API plugin, dans le contexte de la page
  // Grist : les règles d'accès y voient la clé de lien de l'URL et
  // laissent passer. Le logo, lui, est téléchargé par une requête HTTP
  // séparée depuis l'iframe du widget, qui ne connaît pas l'URL de la
  // page parente (origines différentes) — il faut donc lui redonner la
  // clé, sans quoi Grist répond 403 et la page publique perd ses logos.
  //
  // Cette clé n'est pas un secret : elle figure en clair dans l'URL
  // publique distribuée aux visiteurs (`?pp_=lcse-soutien`). Ce sont les
  // règles d'accès du document qui décident ce qu'elle ouvre.
  const PUBLIC_LINK_KEY = "lcse-soutien";
  // Repli quand getAccessToken n'aboutit pas (cas du visiteur anonyme) :
  // il faut bien une base d'URL. À faire évoluer en même temps que le
  // document servi par la page publique.
  const ATTACHMENTS_BASE_URL =
    "https://grist.aucarre.tech/o/docs/api/docs/79GCxUFdb7Py";

  const state = {
    // Onglet d'arrivée : les actions encore à financer, but du widget.
    tab: TAB_OPEN,
    region: ALL,
    dept: ALL,
    fede: ALL,
    club: ALL,
    openActionId: null,
    // Nombre d'actions rendues : on part d'un lot, puis le bouton
    // « Charger 24 actions de plus » l'augmente. Remis à PAGE_SIZE dès
    // que la liste filtrée change (choix de filtre, réinitialisation).
    visibleCount: PAGE_SIZE,
    sent: false,
    submitting: false,
    submitError: "",
    // Erreurs de saisie du formulaire de soutien, par nom de champ.
    fieldErrors: {},
    // Filtres repliés d'emblée sur petit écran (ils y prennent toute la
    // hauteur visible), dépliés sur grand écran où la place ne manque pas.
    // État initial seulement : ensuite, c'est la directive de repli du
    // Design System qui ouvre et ferme le bloc.
    filtersOpen: !(typeof window !== "undefined" && window.matchMedia
      && window.matchMedia("(max-width: 767.98px)").matches),
  };

  let actions = []; // liste jointe et prête à l'affichage
  let loaded = false;
  let loadError = "";

  const app = document.getElementById("app");
  // La modale est rendue hors de <main> (voir index.html) : sur iOS, une
  // zone qui défile devient le référentiel des éléments en position fixe,
  // et la modale se mettrait à défiler avec le contenu.
  const modalRoot = document.getElementById("lcse-modal-root");

  // ---------------------------------------------------------------------
  // Chargement des données
  // ---------------------------------------------------------------------

  async function fetchAll() {
    const [actionsT, drT, ddT, structuresT, federationsT, cofinT, attachToken] = await Promise.all([
      grist.docApi.fetchTable(TABLES.actions),
      grist.docApi.fetchTable(TABLES.dr),
      grist.docApi.fetchTable(TABLES.dd),
      grist.docApi.fetchTable(TABLES.structures),
      grist.docApi.fetchTable(TABLES.federations),
      grist.docApi.fetchTable(TABLES.cofinancements),
      grist.docApi.getAccessToken({ readOnly: true }).catch(() => null),
    ]);

    actions = buildActions(
      { actionsT, drT, ddT, structuresT, federationsT, cofinT },
      {
        // Le jeton, quand il existe, fournit surtout la bonne base d'URL
        // (elle porte l'identifiant du document) ; c'est la clé de lien
        // qui autorise réellement le téléchargement.
        baseUrl: (attachToken && attachToken.baseUrl) || ATTACHMENTS_BASE_URL,
        linkKey: PUBLIC_LINK_KEY,
        token: attachToken ? attachToken.token : null,
      }
    );

    loaded = true;
    loadError = "";
  }

  // ---------------------------------------------------------------------
  // Rendu
  // ---------------------------------------------------------------------

  // Le titre et les filtres sont-ils déjà dans la page ? (voir render)
  let shellRendered = false;

  function render() {
    if (loadError) {
      shellRendered = false;
      app.innerHTML = `
      <div class="alert alert-error" role="alert">
        <div class="alert-body">
          <p class="alert-title">Impossible de charger les actions</p>
          <p class="alert-content">${window.LCSE.escapeHtml(loadError)}</p>
        </div>
      </div>`;
      return;
    }

    if (!loaded) {
      app.innerHTML = renderLoadingState(6);
      return;
    }

    // Les filtres s'appliquent avant la répartition par onglet : on peut
    // ainsi compter ce que contient chaque onglet sous les filtres courants
    // et l'afficher sur les deux, plutôt que de laisser cliquer à l'aveugle.
    const filtered = actions.filter((a) =>
      (state.region === ALL || a.regionLabel === state.region) &&
      (state.dept === ALL || a.deptLabel === state.dept) &&
      (state.fede === ALL || a.federationLabel === state.fede) &&
      (state.club === ALL || a.clubLabel === state.club)
    );

    const counts = {};
    for (const t of TABS) counts[t.key] = actionsForTab(filtered, t.key).length;

    const list = actionsForTab(filtered, state.tab);

    const pagination = paginate(list, state.visibleCount, PAGE_SIZE);

    const countLabel = countLabelFor(state.tab, list.length);

    const openAction = actions.find((a) => a.id === state.openActionId) || null;

    // Le titre et les filtres ne sont dessinés qu'une fois : les champs de
    // filtre (webcomponents Autocomplete) et le bloc repliable gardent ainsi
    // leur état et le focus. Seule la liste (onglets + panneau) est
    // redessinée à chaque changement.
    if (!shellRendered) {
      app.innerHTML = `
    <div class="lcse-title-row">
      <div class="lcse-title-bar"></div>
      <h1 class="lcse-title">Soutenez les clubs sportifs engagés pour l'insertion par le sport</h1>
    </div>
    ${renderFilters(FILTERS, state, activeFilterCount(state), state.filtersOpen, allFilterOptions())}
    <div id="lcse-results"></div>`;
      bindFilterEvents();
      shellRendered = true;
    }
    syncFilters();

    document.getElementById("lcse-results").innerHTML = `
    ${renderTabs(TABS, state.tab, counts)}
    ${renderTabPane(state.tab, `
      <p class="lcse-count">${countLabel}</p>
      ${list.length === 0 ? renderEmptyState() : `<div class="lcse-grid">${pagination.page.map(renderCard).join("")}</div>`}
      ${renderLoadMore(pagination)}
    `)}`;

    renderModalRoot(openAction);

    bindEvents();

    // render() recrée tous les boutons : sans cela, cliquer un onglet au
    // clavier renverrait le focus en haut du document (RGAA 12.8).
    if (pendingAppFocusId) {
      const el = document.getElementById(pendingAppFocusId);
      pendingAppFocusId = "";
      if (el) el.focus();
    }
  }

  // Élément de la page (hors modale) à refocaliser après le prochain rendu.
  let pendingAppFocusId = "";

  // --- Modale : rendu, focus, clavier ----------------------------------
  //
  // render() reconstruit tout le HTML à chaque changement d'état. Pour la
  // modale, cela ferait perdre à la fois les saisies (un échec d'envoi
  // viderait le formulaire) et le focus clavier. On les capture donc avant
  // le rendu et on les restaure après.

  // Id de l'action dont le bouton « Soutenir » a ouvert la modale : le
  // focus y revient à la fermeture (motif « dialog » d'ARIA, RGAA 12.8).
  let modalTriggerId = null;
  let modalWasOpen = false;
  // Champ à focaliser au prochain rendu de la modale (premier champ en
  // erreur après une tentative d'envoi), prioritaire sur le focus courant.
  let pendingFocusId = "";
  // Dernier message d'échec d'envoi déjà annoncé aux lecteurs d'écran.
  let announcedError = "";

  function renderModalRoot(openAction) {
    const oldForm = document.getElementById("lcse-support-form");
    const values = oldForm ? Object.fromEntries(new FormData(oldForm)) : null;
    const focused = modalRoot.contains(document.activeElement) ? document.activeElement.id : "";

    modalRoot.innerHTML = renderModal(openAction, state);

    const open = !!openAction;
    // Le reste de la page devient inerte derrière la modale : ni clic, ni
    // tabulation, ni lecture par les lecteurs d'écran.
    app.inert = open;
    const header = document.querySelector(".lcse-header");
    if (header) header.inert = open;

    const newForm = document.getElementById("lcse-support-form");
    if (newForm && values) {
      for (const [name, value] of Object.entries(values)) {
        const field = newForm.elements.namedItem(name);
        if (field) field.value = value;
      }
    }

    if (open) {
      // À l'ouverture, ou quand l'élément qui avait le focus a disparu
      // (passage au message de confirmation) : premier élément tabulable,
      // le bouton de fermeture en pratique.
      const wanted = pendingFocusId || focused;
      pendingFocusId = "";
      const target = (wanted && document.getElementById(wanted)) || focusableIn(modalRoot)[0];
      if (target) target.focus();

      // Alerte d'échec d'envoi : rendue masquée et vide, on n'y écrit le
      // message qu'une fois la zone en place, pour qu'il soit annoncé.
      // Un message déjà annoncé est réaffiché d'emblée lors des rendus
      // suivants, sans être relu.
      const alertEl = document.getElementById("lcse-submit-alert");
      const message = state.submitError;
      if (alertEl && message) {
        const show = () => {
          const text = document.getElementById("lcse-submit-alert-text");
          if (!text || !alertEl.isConnected) return;
          alertEl.hidden = false;
          text.textContent = message;
        };
        if (message === announcedError) show();
        else { announcedError = message; setTimeout(show, 100); }
      }
      if (!message) announcedError = "";
    } else if (modalWasOpen) {
      const trigger = app.querySelector(`[data-action="support"][data-id="${modalTriggerId}"]`);
      // Si le bouton n'existe plus, on se rabat sur le titre de la page.
      const fallback = app.querySelector("h1");
      if (trigger) trigger.focus();
      else if (fallback) { fallback.tabIndex = -1; fallback.focus(); }
    }
    modalWasOpen = open;
  }

  function focusableIn(root) {
    return Array.from(root.querySelectorAll(
      'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
    )).filter((el) => el.offsetParent !== null || el === document.activeElement);
  }

  function openModal(actionId) {
    modalTriggerId = actionId;
    state.openActionId = actionId;
    state.sent = false;
    state.submitError = "";
    state.fieldErrors = {};
    render();
  }

  function closeModal() {
    state.openActionId = null;
    state.sent = false;
    state.submitError = "";
    state.fieldErrors = {};
    render();
  }

  // Retire l'erreur d'un champ sans re-rendre la modale (ce qui déplacerait
  // le curseur) : dès que la saisie devient valide, le message disparaît.
  function clearFieldError(name) {
    delete state.fieldErrors[name];
    const field = document.getElementById(`f-${name}`);
    if (!field) return;
    const group = field.closest(".form-group");
    if (group) group.classList.remove("has-error");
    field.classList.remove("is-invalid");
    field.removeAttribute("aria-invalid");
    const errorEl = document.getElementById(`error-f-${name}`);
    if (errorEl) errorEl.remove();
    const rest = (field.getAttribute("aria-describedby") || "")
      .split(" ").filter((id) => id && id !== `error-f-${name}`).join(" ");
    if (rest) field.setAttribute("aria-describedby", rest);
    else field.removeAttribute("aria-describedby");
  }

  // Écouteur unique (le document n'est jamais re-rendu) : Échap ferme la
  // modale, Tab et Maj+Tab bouclent à l'intérieur.
  document.addEventListener("keydown", (e) => {
    if (state.openActionId === null) return;
    if (e.key === "Escape") {
      e.preventDefault();
      closeModal();
      return;
    }
    if (e.key !== "Tab") return;
    const items = focusableIn(modalRoot);
    if (!items.length) return;
    const first = items[0];
    const last = items[items.length - 1];
    if (e.shiftKey && (document.activeElement === first || !modalRoot.contains(document.activeElement))) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && (document.activeElement === last || !modalRoot.contains(document.activeElement))) {
      e.preventDefault();
      first.focus();
    }
  });

  // ---------------------------------------------------------------------
  // Événements
  // ---------------------------------------------------------------------

  function bindEvents() {
    app.querySelectorAll("[data-tab]").forEach((el) => {
      el.addEventListener("click", () => {
        const tab = el.getAttribute("data-tab");
        if (tab === state.tab) return;
        state.tab = tab;
        pendingAppFocusId = tabButtonId(tab);
        // La pagination repart du premier lot : l'autre onglet n'a rien à
        // voir avec ce qui était déroulé ici.
        state.visibleCount = PAGE_SIZE;
        // Les filtres sont conservés : c'est justement l'intérêt de voir
        // les compteurs des deux onglets sur un même périmètre.
        render();
      });
    });

    // Lien d'évitement en fin de liste : un lien vers un bouton ne lui
    // donne pas le focus dans tous les navigateurs, on le fait nous-mêmes.
    app.querySelectorAll('[data-action="back-to-tab"]').forEach((el) => {
      el.addEventListener("click", (e) => {
        e.preventDefault();
        const tabButton = document.getElementById(tabButtonId(state.tab));
        if (tabButton) tabButton.focus();
      });
    });

    app.querySelectorAll('[data-action="load-more"]').forEach((el) => {
      el.addEventListener("click", () => {
        const firstNew = state.visibleCount;
        state.visibleCount += PAGE_SIZE;
        // render() remplace la liste : on remet le défilement où il était,
        // sinon le clic renvoie en haut de page.
        const y = window.scrollY;
        render();
        window.scrollTo(0, y);
        // Le bouton a disparu avec la liste : le focus irait en haut du
        // document (RGAA 12.8). Il passe au titre de la première carte
        // ajoutée, là où la lecture reprend.
        const title = app.querySelectorAll(".lcse-grid .lcse-card-title")[firstNew];
        if (title) title.focus({ preventScroll: true });
      });
    });

    app.querySelectorAll('[data-action="support"]').forEach((el) => {
      el.addEventListener("click", () => openModal(Number(el.getAttribute("data-id"))));
    });

    modalRoot.querySelectorAll('[data-action="close"]').forEach((el) => {
      el.addEventListener("click", closeModal);
    });

    const modalContent = modalRoot.querySelector(".modal-content");
    if (modalContent) modalContent.addEventListener("click", (e) => e.stopPropagation());

    const form = document.getElementById("lcse-support-form");
    if (form) {
      form.addEventListener("submit", onSubmitForm);
      // On ne signale pas d'erreur pendant la frappe ; on retire seulement
      // celles qui viennent d'être corrigées.
      form.addEventListener("input", (e) => {
        const name = e.target && e.target.name;
        if (!name || !state.fieldErrors[name]) return;
        const errors = validateSupportForm(Object.fromEntries(new FormData(form)));
        if (!errors[name]) clearFieldError(name);
      });
    }
  }

  // --- Filtres ----------------------------------------------------------

  // Options d'un filtre. Elles ne listent que les valeurs présentes dans
  // l'onglet courant : proposer un club dont toutes les actions sont dans
  // l'autre onglet mènerait à une liste vide.
  function allFilterOptions() {
    return getFilterOptions(actionsForTab(actions, state.tab), state);
  }

  function filterOptions(key) {
    return allFilterOptions()[key] || [];
  }

  // Remet chaque filtre sur sa valeur retenue (après un choix, une
  // réinitialisation, ou le département remis à « Tous » par un changement
  // de région) et met à jour la pastille du nombre de filtres actifs. Les
  // listes déroulantes reçoivent aussi leurs options, qui dépendent de
  // l'onglet et de la région. Le champ de recherche où l'on est en train
  // de taper n'est pas touché.
  function syncFilters() {
    const options = allFilterOptions();
    for (const f of FILTERS) {
      const field = document.getElementById(`lcse-filter-${f.key}`);
      if (!field) continue;
      if (!f.search) {
        field.innerHTML = renderFilterOptions(options[f.key] || [], state[f.key]);
        field.value = state[f.key];
      } else if (field !== document.activeElement && field.value !== state[f.key]) {
        field.value = state[f.key];
      }
    }
    const badge = document.getElementById("lcse-filters-count");
    if (badge) badge.innerHTML = renderFilterBadge(activeFilterCount(state));
  }

  function selectFilterValue(key, value) {
    if (state[key] === value) return;
    state[key] = value;
    if (key === "region") state.dept = ALL;
    state.visibleCount = PAGE_SIZE;
    render();
  }

  // Événements des filtres, posés une seule fois (les filtres ne sont pas
  // redessinés).
  function bindFilterEvents() {
    app.querySelectorAll("ft-autocomplete").forEach((el) => {
      const input = document.getElementById(el.getAttribute("input-id"));
      const key = input && input.dataset.filter;
      if (!key) return;
      // Propriété posée avant même que le webcomponent soit chargé : elle
      // prime sur la méthode par défaut du composant.
      el.searchCallback = (text) => {
        const found = filterSuggestions(filterOptions(key), text, state[key]);
        return found.length ? found.map((name) => ({ name })) : ["empty"];
      };
    });

    app.addEventListener("ft-autocomplete-change", (e) => {
      const input = document.getElementById(e.target.getAttribute("input-id"));
      const key = input && input.dataset.filter;
      if (key && e.detail && e.detail.name) selectFilterValue(key, e.detail.name);
    });

    // Listes déroulantes : le choix s'applique dès qu'il change.
    app.addEventListener("change", (e) => {
      const el = e.target;
      if (el && el.tagName === "SELECT" && el.dataset.filter) selectFilterValue(el.dataset.filter, el.value);
    });

    // Champ de recherche, en le quittant : vidé, il revient à « Toutes » (le bouton
    // d'effacement du composant sert à cela) ; laissé sur une saisie
    // partielle, il réaffiche la valeur retenue.
    app.addEventListener("focusout", (e) => {
      const input = e.target;
      const key = input && input.tagName === "INPUT" && input.dataset.filter;
      if (!key) return;
      setTimeout(() => {
        if (document.activeElement === input) return;
        if (!input.value.trim()) selectFilterValue(key, ALL);
        else if (input.value !== state[key]) input.value = state[key];
      }, 150);
    });

    app.querySelectorAll('[data-action="reset"]').forEach((el) => {
      el.addEventListener("click", () => {
        state.region = ALL; state.dept = ALL; state.fede = ALL; state.club = ALL;
        state.visibleCount = PAGE_SIZE;
        // syncFilters épargne le champ de recherche qui a le focus : on le
        // vide ici explicitement, la réinitialisation vaut pour tous.
        FILTERS.filter((f) => f.search).forEach((f) => {
          const input = document.getElementById(`lcse-filter-${f.key}`);
          if (input) input.value = ALL;
        });
        // L'onglet n'est pas un filtre : "Réinitialiser" ne le change pas.
        render();
      });
    });
  }

  async function onSubmitForm(e) {
    e.preventDefault();
    // Le bouton d'envoi reste focalisable pendant l'envoi (aria-disabled
    // plutôt que disabled, qui lui ferait perdre le focus) : c'est ici
    // qu'on bloque un second envoi.
    if (state.submitting) return;
    const action = actions.find((a) => a.id === state.openActionId);
    if (!action) return;

    const data = new FormData(e.target);
    const errors = validateSupportForm(Object.fromEntries(data));
    const firstInvalid = SUPPORT_FIELDS.find((name) => errors[name]);
    state.fieldErrors = errors;
    state.submitError = "";
    if (firstInvalid) {
      // Focus sur le premier champ en erreur : son message est lu avec
      // lui (aria-describedby).
      pendingFocusId = `f-${firstInvalid}`;
      render();
      return;
    }

    state.submitting = true;
    render();

    try {
      await grist.docApi.applyUserActions([[
        "AddRecord",
        TABLES.soutiens,
        null,
        {
          Organisation: String(data.get("organisation") || "").trim(),
          Prenom: String(data.get("prenom") || "").trim(),
          Nom: String(data.get("nom") || "").trim(),
          Email: String(data.get("email") || "").trim(),
          Telephone: String(data.get("telephone") || "").trim(),
          Montant: parseMontant(data.get("montant")),
          Message: String(data.get("message") || "").trim(),
          Date: Math.floor(Date.now() / 1000),
          Action_financee: action.id,
        },
      ]]);
      state.submitting = false;
      state.sent = true;
      render();
    } catch (err) {
      state.submitting = false;
      state.submitError = "L'envoi a échoué : " + (err && err.message ? err.message : "erreur inconnue") + ". Réessayez.";
      render();
    }
  }

  // ---------------------------------------------------------------------
  // Démarrage
  // ---------------------------------------------------------------------

  grist.ready({ requiredAccess: "full" });

  render();

  fetchAll()
    .then(render)
    .catch((err) => {
      loaded = true;
      loadError = (err && err.message) ? err.message : "Erreur inconnue lors du chargement.";
      render();
    });
})();

</script>
</body>
</html>
