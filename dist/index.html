<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soutenez les clubs sportifs engagés</title>

<!-- Design System France Travail (officiel) -->
<link rel="stylesheet" href="https://cdn.francetravail.fr/studio/design-system/css/styles.css">
<script src="https://cdn.francetravail.fr/webco/v1/ft-autoloader.js" fetchpriority="high"></script>

<!-- API widget Grist (instance auto-hébergée) -->
<script src="https://grist.aucarre.tech/grist-plugin-api.js"></script>

<style>
/* Mise en page du widget "Soutenez les clubs sportifs engagés".
   Les couleurs, la typographie (Marianne), les rayons et les composants
   (.btn, .form-control, .modal, .alert, .badge, .progress) viennent du
   Design System France Travail (styles.css, chargé dans index.html) —
   ce fichier ne fait que composer la mise en page propre au widget avec
   les tokens --ft--*. */

* { box-sizing: border-box; }

html, body {
  margin: 0;
  /* Fond clair du Design System (gray-05). Ce sont les ombres portées des
     cartes qui les détachent, pas un fond foncé. */
  background: var(--ft--color-background-neutral-default-weakest, #f5f5f8);
  color: var(--ft--color-text-color, #2e2e31);
}

body {
  font-family: Marianne, system-ui, -apple-system, "Segoe UI", sans-serif;
}

/* Sur mobile, le widget est souvent affiché dans un cadre (iframe) dont la
   hauteur est fixée par Grist. Si notre page dépasse cette hauteur, iOS ne
   permet pas toujours de faire défiler l'intérieur du cadre : tout ce qui
   dépasse devient inatteignable. On force donc la page à ne jamais dépasser
   la hauteur qu'on lui donne, et c'est la zone de contenu qui défile
   elle-même (avec le défilement tactile iOS activé explicitement). */
@media (max-width: 680px) {
  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  .lcse-header {
    flex: 0 0 auto;
  }

  .lcse-main {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    /* Pas de -webkit-overflow-scrolling:touch ici : sur iOS il fait de
       cette zone le référentiel des éléments en position fixe, ce qui
       décrochait la modale. Le défilement fluide est natif depuis iOS 13,
       cette propriété n'apporte plus rien. */
    overscroll-behavior: contain;
  }
}

.lcse-header {
  background: #fff;
  border-bottom: 1px solid var(--ft--color-border-neutral-default-weaker, #e6e7ec);
  padding: 1rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1rem 1.5rem;
}

.lcse-header-logo {
  height: 40px;
  width: auto;
  max-width: 100%;
}

.lcse-header-logo-lcse {
  height: 64px;
}

@media (max-width: 480px) {
  .lcse-header { padding: 0.75rem 1rem; gap: 0.75rem 1rem; }
  .lcse-header-logo { height: 28px; }
  .lcse-header-logo-lcse { height: 44px; }
}

.lcse-main {
  max-width: 1440px;
  margin: 0 auto;
  padding: 2rem 1.25rem 3.5rem;
}

@media (max-width: 480px) {
  .lcse-main { padding: 1.5rem 0.875rem 2.5rem; }
}

.lcse-loading,
.lcse-error {
  padding: 2rem 0;
  color: var(--ft--color-background-neutral-default-strong, #5b5d65);
}

.lcse-title-row {
  display: flex;
  align-items: flex-start;
  gap: 1rem;
  margin-bottom: 2rem;
}

.lcse-title-bar {
  width: 4px;
  align-self: stretch;
  flex: 0 0 4px;
  background: var(--ft--color-primary, #283276);
  border-radius: 2px;
}

.lcse-title {
  margin: 0;
  font-family: Marianne, system-ui, sans-serif;
  font-size: var(--ft--font-size-display-4, 1.75rem);
  font-weight: 700;
  letter-spacing: -0.01em;
}

@media (max-width: 480px) {
  .lcse-title { font-size: 1.375rem; }
}

/* Filtres */

.lcse-filters {
  background: #fff;
  border: 1px solid var(--ft--color-border-neutral-default-weaker, #e6e7ec);
  border-radius: var(--ft--button-border-radius, 0.75rem);
  margin-bottom: 1.5rem;
  /* Pas d'overflow:hidden ici : il découperait les listes déroulantes des
     combobox de filtre, qui dépassent sous le cadre. Les coins de l'entête
     sont arrondis directement ci-dessous à la place. */
}

.lcse-filters-head {
  background: var(--ft--color-primary-05, #eaecfb);
  padding: 0.75rem 1.25rem;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.75rem;
  border-radius: var(--ft--button-border-radius, 0.75rem) var(--ft--button-border-radius, 0.75rem) 0 0;
}

.lcse-filters-toggle {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  border: 0;
  background: none;
  padding: 0;
  cursor: pointer;
  font-family: inherit;
}

.lcse-filters-toggle-chevron {
  flex: 0 0 auto;
  width: 0.5rem;
  height: 0.5rem;
  border-right: 2px solid var(--ft--color-primary, #283276);
  border-bottom: 2px solid var(--ft--color-primary, #283276);
  transform: rotate(-45deg);
  transition: transform 0.15s ease;
}

.lcse-filters-toggle-chevron.is-open {
  transform: rotate(45deg);
}

.lcse-filters-title {
  margin: 0;
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ft--color-primary, #283276);
}

.lcse-reset-btn {
  border: 0;
  background: none;
  color: var(--ft--color-primary, #283276);
  font-size: 0.75rem;
  font-weight: 600;
  text-decoration: underline;
  cursor: pointer;
  padding: 0;
  font-family: inherit;
}

.lcse-reset-btn:hover { color: var(--ft--color-primary-hover, #1b2256); }

.lcse-filters-grid {
  padding: 1.125rem 1.25rem 1.25rem;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1rem 1.5rem;
}

@media (max-width: 900px) {
  .lcse-filters-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .lcse-filters-grid { grid-template-columns: 1fr; }
}

/* Onglets (composant .nav-tabs du Design System) */

.lcse-tabs {
  /* Le Design System pose margin-bottom:-1px sur .nav-tabs pour que
     l'onglet actif recouvre la bordure du panneau. On fournit cette
     bordure ici, faute de .tab-content : sans elle, les onglets flottent. */
  border-bottom: 1px solid rgba(18, 20, 55, 0.1);
  margin: 0 0 1.25rem;
}

.lcse-tabs .nav-item {
  /* Largeur du libellé (flex-grow:0), sinon chaque onglet occupe la moitié
     de la ligne et se retrouve démesuré. flex-shrink:1 + min-width:0
     autorisent le rétrécissement sur un widget étroit — .nav-tabs étant en
     flex-wrap:nowrap, sans cela les libellés déborderaient. */
  flex: 0 1 auto;
  min-width: 0;
}

.lcse-tabs .nav-link {
  cursor: pointer;
  font-size: 0.9375rem;
}

.lcse-tabs .nav-link .nav-link-text {
  /* Les libellés sont longs ("Actions déjà financées (12)") : on autorise
     le retour à la ligne plutôt que la troncature. */
  white-space: normal;
}

/* Pied de carte d'une action déjà financée : la mention remplace le
   bouton "Soutenir", sans en prendre l'apparence — ce n'est pas une
   action possible, juste un état. */
.lcse-card-financed {
  flex: 0 0 auto;
  margin: 0;
  padding: 0 0.75rem;
  font-size: 0.875rem;
  font-weight: 700;
  white-space: nowrap;
  color: var(--ft--color-primary, #283276);
}

.lcse-count {
  margin: 0 0 1.25rem;
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--ft--color-background-neutral-default-strong, #5b5d65);
}

/* Grille de cartes */

.lcse-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1.25rem;
}

@media (max-width: 1080px) {
  .lcse-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 680px) {
  .lcse-grid { grid-template-columns: 1fr; }
}

/* Pied de liste : « Charger 24 actions de plus » */

.lcse-more {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  margin-top: 1.75rem;
}

.lcse-more-info {
  margin: 0;
  font-size: 0.875rem;
  color: var(--ft--color-background-neutral-default-strong, #5b5d65);
}

.lcse-card {
  background: #fff;
  border: 1px solid var(--ft--color-border-neutral-default-weaker, #e6e7ec);
  border-radius: var(--ft--button-border-radius, 0.75rem);
  /* Ombre dérivée de celle du Design System France Travail (0 0 8px
     rgba(15,20,56,.16)), légèrement accentuée et décalée vers le bas pour
     bien détacher la carte sur le fond clair. */
  box-shadow: 0 2px 12px 0 rgba(15, 20, 56, 0.22);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.lcse-card-body {
  padding: 1.25rem 1.25rem 0;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.lcse-card-top {
  display: flex;
  gap: 1rem;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 1.25rem;
}

.lcse-card-heading {
  /* Sans ça, un flex item contenant du texte refuse de rétrécir sous sa
     largeur "naturelle" et peut déborder sur un écran étroit. Ciblé par
     classe (pas par `.lcse-card-top > div`) pour ne jamais accrocher
     .lcse-card-photo, qui est aussi une div enfant directe. */
  flex: 1 1 auto;
  min-width: 0;
}

.lcse-card-date {
  margin: 0 0 0.5rem;
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ft--color-primary, #283276);
}

.lcse-card-title {
  margin: 0;
  font-size: 1.125rem;
  font-weight: 700;
  letter-spacing: -0.005em;
  line-height: 1.3;
}

.lcse-card-photo {
  flex: 0 0 88px;
  width: 88px;
  height: 66px;
  border-radius: 0.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.6875rem;
  color: var(--ft--color-background-neutral-default-strong, #5b5d65);
  overflow: hidden;
}

/* Cadre + fond uniquement tant qu'il n'y a pas de logo à afficher */
.lcse-card-photo:not(:has(img)) {
  border: 1px solid var(--ft--color-border-neutral-default-weaker, #e6e7ec);
  background: var(--ft--color-background-neutral-default-weakest, #f5f5f8);
}

.lcse-card-photo img {
  width: 100%;
  height: 100%;
  object-fit: contain; /* logo de club : on veut le voir en entier, pas le rogner comme une photo */
  padding: 0.25rem;
}

.lcse-card-club {
  margin: 0 0 0.75rem;
  font-size: 1rem;
  font-weight: 700;
  color: var(--ft--color-primary, #283276);
}

.lcse-card-meta {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.75rem 1rem;
  margin: 0 0 1.25rem;
  padding-top: 1rem;
  border-top: 1px solid var(--ft--color-border-neutral-default-weaker, #e6e7ec);
}

@media (max-width: 380px) {
  .lcse-card-meta { grid-template-columns: 1fr; }
}

.lcse-card-meta dt {
  font-size: 0.6875rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ft--color-background-neutral-default-strong, #5b5d65);
  margin-bottom: 0.125rem;
}

.lcse-card-meta dd {
  margin: 0;
  font-size: 0.9375rem;
  font-weight: 600;
}

.lcse-card-footer {
  display: flex;
  align-items: center;
  gap: 0.75rem 1.25rem;
  flex-wrap: wrap;
  margin-top: auto;
  margin-bottom: 1.25rem;
}

/* Le bouton garde sa largeur naturelle (flex-grow:0) : il ne s'étire plus
   pour égaler la jauge, qui récupère toute la place restante. Le
   remplissage horizontal est resserré à la valeur des boutons compacts du
   Design System (--ft--button-sm-padding-x) au lieu de celle des boutons
   normaux (1rem), pour ne pas laisser de vide de part et d'autre de
   « Soutenir » — la hauteur, elle, reste celle d'un bouton normal
   (2,5rem), suffisante au doigt. */
.lcse-card-footer .btn {
  flex: 0 0 auto;
  padding: 0 0.75rem;
  /* 14px, comme le bouton du design de référence (Page de soutien.dc.html) :
     le Design System met 16px par défaut, ce qui élargissait le bouton
     d'une vingtaine de pixels sans rien apporter. */
  font-size: 0.875rem;
  white-space: nowrap;
}

/* flex-basis à 0 (et non auto) : la largeur naturelle du libellé de la
   jauge n'entre pas dans le calcul du retour à la ligne, donc le bouton
   reste à côté de la jauge au lieu de passer sous elle sur les cartes
   étroites (grille à trois colonnes). La jauge prend tout le reste. */
.lcse-card-progress { flex: 1 1 0; min-width: 0; }

/* Après les règles de base, sinon `flex: 1 1 0` ci-dessus écraserait ce
   flex-basis (une media query n'ajoute pas de spécificité, c'est l'ordre
   qui tranche — l'empilement de la jauge ne fonctionnait pas). */
@media (max-width: 420px) {
  /* En dessous de cette largeur, la jauge prend toute la ligne et le
     bouton passe en dessous. Il garde sa largeur naturelle : l'étirer à
     100% (ce que faisait cette règle) donnait un bouton pleine largeur
     qui écrasait tous les réglages de taille ci-dessus. margin-left:auto
     le pousse à droite, comme dans la disposition large. */
  .lcse-card-progress { flex-basis: 100%; }
  .lcse-card-footer .btn { margin-left: auto; }
}

.lcse-card-progress .progress-label {
  margin-bottom: 0.375rem;
  /* 14px comme la référence (et non 13px) : c'est le montant cofinancé,
     l'information que la carte doit mettre en avant. */
  font-size: 0.875rem;
  font-weight: 600;
}

/* 10px : un cran au-dessus des 8px du design de référence, la barre se
   lit mieux sans devenir un bandeau. */
.lcse-card-progress .progress { width: 100%; height: 0.625rem; }
.lcse-card-progress .progress-bar { background-color: var(--ft--color-primary, #283276); height: 100%; }

/* Modale de soutien */

.modal-backdrop.show,
.lcse-modal.show {
  display: block;
}

/* Le Design System attend que .modal-body et .modal-footer soient des
   enfants DIRECTS de .modal-content pour que sa mise en page flex
   (entête / corps qui défile / pied de page fixe, via
   .modal-dialog-scrollable) fonctionne. Notre <form> — nécessaire pour
   la soumission — casse cette chaîne ; display:contents le fait
   disparaître de la boîte de mise en page sans perdre son rôle
   fonctionnel, comme si .modal-body/.modal-footer étaient directement
   dans .modal-content. */
#lcse-support-form {
  display: contents;
}

/* Même piège flexbox classique que d'habitude : sans min-height:0, .modal-body
   (flex:1 1 auto côté DS) refuse de rétrécir sous la hauteur naturelle de
   son contenu et empêche le pied de page d'être visible sur un écran bas. */
.lcse-modal .modal-body {
  min-height: 0;
}

.lcse-modal-header {
  background: var(--ft--color-primary-05, #eaecfb);
  padding: 1.25rem 1.5rem;
}

.lcse-modal-kicker {
  margin: 0 0 0.25rem;
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ft--color-primary, #283276);
}

.lcse-modal-meta {
  margin: 0.125rem 0 0;
  font-size: 0.8125rem;
  color: var(--ft--color-background-neutral-default-strong, #5b5d65);
}

.lcse-form-body {
  padding-top: 1.5rem !important;
}

.lcse-sent-body {
  padding-top: 1.75rem !important;
}

.lcse-modal-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0 1rem;
}

/* Sur mobile, la modale occupe toute la zone du widget plutôt que d'être
   centrée verticalement : centrée, elle se positionne au milieu du cadre,
   qui peut être plus haut que ce que l'écran affiche réellement — d'où un
   titre coupé en haut. Ancrée en haut et en pleine hauteur, elle est
   toujours entièrement visible. Les espacements sont aussi resserrés pour
   que le formulaire tienne sans que tout paraisse surdimensionné. */
@media (max-width: 680px) {
  .lcse-modal .modal-dialog {
    width: 100%;
    max-width: 100%;
    min-width: 0;
    height: 100%;
    max-height: 100%;
    margin: 0;
    align-items: stretch;
  }

  .lcse-modal .modal-content {
    height: 100%;
    max-height: 100%;
    border-radius: 0;
    border: 0;
  }

  .lcse-modal-header {
    padding: 0.875rem 1rem;
  }

  .lcse-modal-kicker {
    /* Une ligne de gagnée : le contexte est déjà donné par le titre. */
    display: none;
  }

  .lcse-modal .modal-title {
    font-size: 1rem;
    line-height: 1.3;
  }

  .lcse-modal-meta {
    font-size: 0.75rem;
  }

  .lcse-modal .modal-body {
    padding: 1rem !important;
  }

  .lcse-modal .form-group {
    margin-bottom: 0.75rem;
  }

  .lcse-modal .form-label {
    font-size: 0.875rem;
  }

  .lcse-modal .modal-footer {
    padding: 0.75rem 1rem;
  }
}

/* Filtres avec recherche (combobox) */

.lcse-combo-wrap {
  position: relative;
}

.lcse-combo-wrap input {
  padding-right: 2rem;
}

.lcse-combo-wrap::after {
  content: "";
  position: absolute;
  right: 0.875rem;
  top: 50%;
  width: 0.5rem;
  height: 0.5rem;
  border-right: 2px solid var(--ft--color-background-neutral-default-strong, #5b5d65);
  border-bottom: 2px solid var(--ft--color-background-neutral-default-strong, #5b5d65);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

.lcse-combo-list {
  position: absolute;
  top: calc(100% + 0.25rem);
  left: 0;
  right: 0;
  z-index: 20;
  margin: 0;
  padding: 0.25rem;
  list-style: none;
  background: #fff;
  border: 1px solid var(--ft--color-border-neutral-default-weaker, #e6e7ec);
  border-radius: 0.5rem;
  box-shadow: 0 8px 24px rgba(15, 20, 56, 0.14);
  max-height: 15rem;
  overflow-y: auto;
}

.lcse-combo-option {
  padding: 0.5rem 0.625rem;
  border-radius: 0.375rem;
  font-size: 0.9375rem;
  cursor: pointer;
}

.lcse-combo-option:hover,
.lcse-combo-option:active {
  background: var(--ft--color-primary-05, #eaecfb);
}

.lcse-combo-option.is-selected {
  font-weight: 700;
  color: var(--ft--color-primary, #283276);
}

.lcse-combo-empty {
  padding: 0.5rem 0.625rem;
  font-size: 0.875rem;
  font-style: italic;
  color: var(--ft--color-background-neutral-default-strong, #5b5d65);
}

/* Utilitaires */

.lcse-hidden { display: none !important; }

</style>

<body>

<header class="lcse-header">
  <img src="https://cdn.francetravail.fr/studio/logos/marque/Logo_France_Travail_RVB_Horizontal_Coul_Positif.svg" alt="France Travail" class="lcse-header-logo">
  <img src="https://lesclubs-sportifs-engages.francetravail.fr/img/logo-lcse.svg" alt="Les clubs sportifs engagés" class="lcse-header-logo lcse-header-logo-lcse">
</header>

<main id="app" class="lcse-main">
  <div class="lcse-loading" id="state-loading">
    <p>Chargement des actions…</p>
  </div>
</main>

<!-- La modale vit hors de <main> : à l'intérieur d'une zone qui défile,
     iOS ancre les éléments en position fixe sur cette zone au lieu de
     l'écran, et la modale suivrait le défilement. -->
<div id="lcse-modal-root"></div>

<script>
/* ---- src/logic.js ---- */
/*
 * Logique pure du widget "Soutenez les clubs sportifs engagés" : formatage,
 * jointure des tables Grist, calcul des filtres. Aucune de ces fonctions ne
 * touche au DOM ni à `grist` — elles prennent des données en entrée et
 * renvoient des données en sortie, ce qui les rend testables sous Node
 * (voir test/logic.test.js) sans navigateur ni widget Grist réel.
 *
 * Chargé à la fois :
 *  - dans le navigateur, comme <script src="./src/logic.js"><\/script>
 *    classique (pas de module) : les fonctions sont exposées sur
 *    `window.LCSE`.
 *  - sous Node, via require("./logic.js") pour les tests : `module` existe
 *    alors et on exporte le même objet.
 */
(function (root) {
  "use strict";

  const ALL = "Toutes";

  const TABLES = {
    actions: "Actions",
    dr: "DR",
    dd: "DD",
    agences: "Agences",
    structures: "Structures",
    federations: "Federations",
    cofinancements: "Cofinancements",
    soutiens: "Soutiens",
  };

  const FILTER_KEYS = ["region", "dept", "fede", "club"];

  // Les deux onglets. TAB_OPEN est celui d'arrivée : c'est la raison d'être
  // du widget (trouver une action à cofinancer) ; TAB_FUNDED sert à montrer
  // ce qui a abouti, sans polluer la liste utile.
  const TAB_OPEN = "a-soutenir";
  const TAB_FUNDED = "financees";
  const TABS = [
    { key: TAB_OPEN, label: "Actions à soutenir" },
    { key: TAB_FUNDED, label: "Actions déjà financées" },
  ];

  // Nombre d'actions affichées d'emblée, et taille de chaque lot ajouté
  // ensuite par le bouton « Charger 24 actions de plus ». Toutes les
  // actions restent chargées en mémoire : on ne limite que ce qui est
  // effectivement rendu dans le DOM (et donc les logos à télécharger),
  // ce qui est le poste de coût réel à l'affichage.
  const PAGE_SIZE = 24;

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  // toLocaleString("fr-FR") sépare les milliers par une espace fine
  // insécable (U+202F), pas une espace normale : on la remplace par une
  // espace normale pour un rendu/copier-coller plus prévisible.
  function eur(n) {
    const num = Number(n) || 0;
    return num.toLocaleString("fr-FR").replace(/ /g, " ") + " €";
  }

  // Fuseau fixé à Europe/Paris : ces dates sont celles d'actions en France
  // et doivent s'afficher pareil pour tout le monde, quel que soit le
  // fuseau du navigateur du visiteur (ou de la machine qui exécute les
  // tests).
  function formatDateFr(ts) {
    if (ts === null || ts === undefined || ts === false) return "Date à préciser";
    const d = new Date(ts * 1000);
    return new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "long", year: "numeric", timeZone: "Europe/Paris" }).format(d);
  }

  // Grist encode les ChoiceList/RefList/Attachments en ["L", v1, v2, ...].
  function unpackList(value) {
    if (Array.isArray(value)) {
      return value[0] === "L" ? value.slice(1) : value;
    }
    return [];
  }

  function uniqSorted(values) {
    return Array.from(new Set(values.filter((v) => v))).sort((a, b) => a.localeCompare(b, "fr"));
  }

  function filterOptionsByQuery(options, query) {
    const q = String(query || "").trim().toLocaleLowerCase("fr-FR");
    if (!q) return options;
    return options.filter((o) => o.toLocaleLowerCase("fr-FR").includes(q));
  }

  // grist.docApi.fetchTable renvoie un objet en colonnes ({id:[...], Col:[...]}).
  // On le transforme en tableau de lignes {id, Col, ...}.
  function rowsFromColumnTable(table) {

    return ids.map((id, i) => {
      const row = { id };
      for (const col of Object.keys(table)) {
        if (col === "id") continue;
        row[col] = table[col][i];
      }
      return row;
    });

  function indexById(rows) {
    const map = new Map();
    for (const r of rows) map.set(r.id, r);

  // Seules ces adresses sont acceptées comme logo : on refuse notamment les
  // "javascript:" et "data:" qui pourraient être injectés via la donnée.
  function isSafeImageUrl(value) {
    return /^https?:\/\//i.test(String(value || "").trim());
  }

  /**
   * Adresse du logo d'un club, par ordre de préférence :
   *  1. la colonne texte `Logo_url` de Structures — une simple adresse
   *     d'image, qui ne dépend d'aucun jeton ni permission et fonctionne
   *     donc sur n'importe quelle instance Grist ;
   *  2. à défaut, la pièce jointe `Logo`, qui exige un jeton d'accès
   *     (grist.docApi.getAccessToken) — indisponible sur certaines
   *     instances, auquel cas attachToken vaut null et on renvoie null.
   */
  function photoUrlFor(structure, attachToken) {
    if (!structure) return null;

    const url = structure.Logo_url;
    if (isSafeImageUrl(url)) return String(url).trim();

    if (!attachToken) return null;
    const ids = unpackList(structure.Logo);
    if (!ids.length) return null;
    return `${attachToken.baseUrl}/attachments/${ids[0]}/download?auth=${attachToken.token}`;
  }

  // Statuts qui retirent une action du widget, quel que soit son financement.
  const HIDDEN_STATUTS = new Set(["Réalisée", "Annulée"]);

  // La date affichée dépend du statut : une date exacte n'a de sens que
  // pour une action "Planifiée" ; tant que c'est "A confirmer" (ou tout
  // autre statut), on affiche la période approximative en texte libre.
  function dateLabelFor(a) {
    if (a.Statut === "Planifiée") return formatDateFr(a.Date);
    const approx = a.Periode_approx && String(a.Periode_approx).trim();
    return approx || "Date à préciser";
  }

  // Horodatage brut d'une action, ou null s'il n'y en a pas d'exploitable.
  // Grist renvoie null, false ou "" pour une date vide selon les cas.
  function dateTsOf(a) {
    const ts = a.Date;
    if (ts === null || ts === undefined || ts === false || ts === "") return null;
    const n = Number(ts);
    return Number.isFinite(n) ? n : null;
  }

  /**
   * Tri chronologique croissant, sur l'horodatage brut et non sur
   * `dateLabel` : celui-ci est du texte ("Courant novembre 2026", "Date à
   * préciser") et se trierait alphabétiquement.
   *
   * Les actions sans date connue ne peuvent pas être placées dans la
   * chronologie : elles sont regroupées à la fin. À date égale — ou entre
   * deux actions sans date — l'id tranche, pour que l'ordre affiché soit
   * toujours le même d'un chargement à l'autre.
   *
   * Ne modifie pas le tableau reçu.
   */
  function sortByDateAsc(actions) {
    return actions.slice().sort((x, y) => {
      if (x.dateTs === null && y.dateTs === null) return x.id - y.id;
      if (x.dateTs === null) return 1;
      if (y.dateTs === null) return -1;
      return (x.dateTs - y.dateTs) || (x.id - y.id);

  /**
   * Assemble les tables brutes (au format colonnes de grist.docApi.fetchTable)
   * en une liste d'actions prêtes à l'affichage : résolution des références

   * partir de Cofinancements, et labels formatés en français.
   *
   * Seul le statut retire une action du résultat : "Réalisée" ou "Annulée".
   * Les actions financées à 100 % sont conservées et marquées `financee`,
   * pour alimenter l'onglet "Actions déjà financées" — elles étaient
   * auparavant écartées d'office, avant que le client demande de les
   * montrer à part plutôt que de les masquer.
   *
   * @param {object} tables { actionsT, drT, ddT, agencesT, structuresT, federationsT, cofinT }
   *   — chacune au format renvoyé par grist.docApi.fetchTable.
   * @param {{baseUrl:string, token:string}|null} attachToken pour construire
   *   les URLs de téléchargement des logos (Structures.Logo), ou null si
   *   indisponible (les logos retombent alors sur le placeholder).
   */
  function buildActions(tables, attachToken) {
    const { actionsT, drT, ddT, agencesT, structuresT, federationsT, cofinT } = tables;

    const drMap = indexById(rowsFromColumnTable(drT));
    const ddMap = indexById(rowsFromColumnTable(ddT));
    const agenceMap = indexById(rowsFromColumnTable(agencesT));
    const structureMap = indexById(rowsFromColumnTable(structuresT));
    const federationMap = indexById(rowsFromColumnTable(federationsT));
    const cofinRows = rowsFromColumnTable(cofinT);

    const collecteByAction = new Map();
    for (const c of cofinRows) {
      if (!c.Action) continue;
      collecteByAction.set(c.Action, (collecteByAction.get(c.Action) || 0) + (Number(c.Montant) || 0));
    }

    const rawActions = rowsFromColumnTable(actionsT);

    // sortByDateAsc en sortie : l'ordre chronologique vaut pour les deux
    // onglets et pour la pagination, qui découpe cette liste telle quelle.
    return sortByDateAsc(rawActions
      .map((a) => {
        const dr = a.DR ? drMap.get(a.DR) : null;
        const dd = a.DD ? ddMap.get(a.DD) : null;
        const agence = a.Agence ? agenceMap.get(a.Agence) : null;
        const structure = a.Club ? structureMap.get(a.Club) : null;
        const federation = a.Federation ? federationMap.get(a.Federation) : null;
        const budget = Number(a.Budget) || 0;
        const collecte = collecteByAction.get(a.id) || 0;
        const pct = budget > 0 ? Math.min(100, Math.round((collecte / budget) * 100)) : (collecte > 0 ? 100 : 0);
        const publicLabels = unpackList(a.Public);

        return {
          id: a.id,
          intitule: a.Intitule || "(sans titre)",
          financee: pct >= 100,
          statut: a.Statut || "",
          dateLabel: dateLabelFor(a),
          dateTs: dateTsOf(a),
          clubLabel: structure ? structure.Nom : "Club non renseigné",
          villeLabel: agence ? agence.Libelle_agence : "Non précisée",
          federationLabel: federation ? federation.Nom : "Non précisée",
          regionLabel: dr ? dr.Nom : "",
          deptLabel: dd ? dd.Nom : "",
          participantsLabel: (a.Jauge || a.Jauge === 0) ? (Number(a.Jauge).toLocaleString("fr-FR") + " participants") : "Non précisé",
          publicLabel: publicLabels.length ? publicLabels.join(", ") : "Non précisé",
          photoUrl: photoUrlFor(structure, attachToken),
          budget,
          collecte,
          pct,
          collecteLabel: eur(collecte) + " cofinancés sur " + eur(budget),
        };
      })
      // Une action Réalisée ou Annulée n'a plus rien à faire dans le widget,
      // quel que soit son financement.
      .filter((a) => !HIDDEN_STATUTS.has(a.statut)));
  }

  /**
   * Découpe la liste filtrée en une page cumulative : les `visibleCount`
   * premières actions. Fonction pure, indépendante du DOM.
   *
   * @param {Array} list actions déjà filtrées, dans l'ordre d'affichage.
   * @param {number} visibleCount nombre d'actions à afficher.
   * @param {number} [pageSize=PAGE_SIZE] taille du prochain lot.
   * @returns {{page:Array, shown:number, total:number, remaining:number, nextBatch:number}}
   */
  function paginate(list, visibleCount, pageSize) {
    const size = Number(pageSize) > 0 ? Number(pageSize) : PAGE_SIZE;
    const total = list.length;
    const shown = Math.max(0, Math.min(Number(visibleCount) || 0, total));
    const remaining = total - shown;
    return {
      page: list.slice(0, shown),
      shown,
      total,
      remaining,
      nextBatch: Math.min(size, remaining),
    };
  }

  // Répartit les actions selon l'onglet : financées à 100 % d'un côté,
  // toutes les autres de l'autre. Aucune action n'apparaît dans les deux.
  function actionsForTab(actions, tab) {
    const wantFunded = tab === TAB_FUNDED;
    return actions.filter((a) => !!a.financee === wantFunded);
  }

  // Le compteur au-dessus de la liste : la formulation dépend de l'onglet,
  // "ouverte au soutien" n'ayant aucun sens pour une action déjà financée.
  function countLabelFor(tab, n) {
    if (tab === TAB_FUNDED) {
      if (n === 0) return "Aucune action financée à 100 %";
      return n === 1 ? "1 action financée à 100 %" : `${n} actions financées à 100 %`;

    return n === 1 ? "1 action ouverte au soutien" : `${n} actions ouvertes au soutien`;

  // région choisie ; fédération et club restent globaux (comportement du
  // prototype d'origine, conservé tel quel).

    return {
      region: [ALL, ...uniqSorted(actions.map((a) => a.regionLabel))],
      dept: [ALL, ...uniqSorted(inRegion.map((a) => a.deptLabel))],
      fede: [ALL, ...uniqSorted(actions.map((a) => a.federationLabel))],
      club: [ALL, ...uniqSorted(actions.map((a) => a.clubLabel))],

  }

  const api = {
    ALL,
    TABLES,
    FILTER_KEYS,
    PAGE_SIZE,
    TABS,
    TAB_OPEN,
    TAB_FUNDED,
    escapeHtml,
    eur,
    formatDateFr,
    unpackList,
    uniqSorted,
    filterOptionsByQuery,
    rowsFromColumnTable,
    indexById,
    photoUrlFor,

    sortByDateAsc,
    actionsForTab,
    countLabelFor,
    paginate,
    getFilterOptions,

  } else {

 */
(function () {
  "use strict";

  const {
    ALL, TABLES, FILTER_KEYS, PAGE_SIZE, TABS, TAB_OPEN,
    getFilterOptions, filterOptionsByQuery, buildActions, paginate,
    actionsForTab, countLabelFor,
  } = window.LCSE;
  const {
    renderEmptyState, renderCard, renderTabs, renderLoadMore, renderCombo,
    comboOptionsHtml, renderModal,
  } = window.LCSE;

  const state = {
    // Onglet d'arrivée : les actions encore à financer, but du widget.
    tab: TAB_OPEN,
    region: ALL,
    dept: ALL,
    fede: ALL,
    club: ALL,
    openActionId: null,
    // Nombre d'actions rendues : on part d'un lot, puis le bouton
    // « Charger 24 actions de plus » l'augmente. Remis à PAGE_SIZE dès
    // que la liste filtrée change (choix de filtre, réinitialisation).
    visibleCount: PAGE_SIZE,
    sent: false,
    submitting: false,
    submitError: "",
    // Filtres repliés d'emblée sur petit écran (ils y prennent toute la
    // hauteur visible), dépliés sur grand écran où la place ne manque pas.
    filtersOpen: !(typeof window !== "undefined" && window.matchMedia
      && window.matchMedia("(max-width: 680px)").matches),
  };

  // État transitoire des combobox de recherche des filtres (texte tapé,
  // liste ouverte/fermée) — distinct de `state`, qui ne garde que la valeur
  // retenue pour chaque filtre.
  const combo = {
    region: { open: false, query: "" },
    dept: { open: false, query: "" },
    fede: { open: false, query: "" },
    club: { open: false, query: "" },
  };

  let actions = []; // liste jointe et prête à l'affichage
  let loaded = false;
  let loadError = "";

  const app = document.getElementById("app");
  // La modale est rendue hors de <main> (voir index.html) : sur iOS, une
  // zone qui défile devient le référentiel des éléments en position fixe,
  // et la modale se mettrait à défiler avec le contenu.
  const modalRoot = document.getElementById("lcse-modal-root");

  // ---------------------------------------------------------------------
  // Chargement des données
  // ---------------------------------------------------------------------

  async function fetchAll() {
    const [actionsT, drT, ddT, agencesT, structuresT, federationsT, cofinT, attachToken] = await Promise.all([
      grist.docApi.fetchTable(TABLES.actions),
      grist.docApi.fetchTable(TABLES.dr),
      grist.docApi.fetchTable(TABLES.dd),
      grist.docApi.fetchTable(TABLES.agences),
      grist.docApi.fetchTable(TABLES.structures),
      grist.docApi.fetchTable(TABLES.federations),
      grist.docApi.fetchTable(TABLES.cofinancements),
      grist.docApi.getAccessToken({ readOnly: true }).catch(() => null),
    ]);

    actions = buildActions(
      { actionsT, drT, ddT, agencesT, structuresT, federationsT, cofinT },
      attachToken
    );

    loaded = true;
    loadError = "";
  }

  // ---------------------------------------------------------------------
  // Rendu
  // ---------------------------------------------------------------------

  function render() {
    if (loadError) {
      app.innerHTML = `
      <div class="alert alert-error" role="alert">
        <div class="alert-body">
          <p class="alert-title">Impossible de charger les actions</p>
          <p class="alert-content">${window.LCSE.escapeHtml(loadError)}</p>
        </div>
      </div>`;
      return;
    }

    if (!loaded) {
      app.innerHTML = `<div class="lcse-loading"><p>Chargement des actions…</p></div>`;
      return;
    }

    // Les filtres s'appliquent avant la répartition par onglet : on peut
    // ainsi compter ce que contient chaque onglet sous les filtres courants
    // et l'afficher sur les deux, plutôt que de laisser cliquer à l'aveugle.
    const filtered = actions.filter((a) =>
      (state.region === ALL || a.regionLabel === state.region) &&
      (state.dept === ALL || a.deptLabel === state.dept) &&
      (state.fede === ALL || a.federationLabel === state.fede) &&
      (state.club === ALL || a.clubLabel === state.club)
    );

    const counts = {};
    for (const t of TABS) counts[t.key] = actionsForTab(filtered, t.key).length;

    const list = actionsForTab(filtered, state.tab);

    // Les options des filtres ne listent que les valeurs présentes dans
    // l'onglet courant : proposer un club dont toutes les actions sont
    // dans l'autre onglet mènerait à une liste vide.
    const options = getFilterOptions(actionsForTab(actions, state.tab), state);
    const pagination = paginate(list, state.visibleCount, PAGE_SIZE);

    const countLabel = countLabelFor(state.tab, list.length);

    const openAction = actions.find((a) => a.id === state.openActionId) || null;

    app.innerHTML = `
    <div class="lcse-title-row">
      <div class="lcse-title-bar"></div>
      <h1 class="lcse-title">Soutenez les clubs sportifs engagés pour l'insertion par le sport</h1>
    </div>

    <section class="lcse-filters">
      <div class="lcse-filters-head">
        <button type="button" class="lcse-filters-toggle" data-action="toggle-filters" aria-expanded="${state.filtersOpen ? "true" : "false"}">
          <span class="lcse-filters-toggle-chevron ${state.filtersOpen ? "is-open" : ""}" aria-hidden="true"></span>
          <h2 class="lcse-filters-title">Filtres</h2>
        </button>
        <button type="button" class="lcse-reset-btn" data-action="reset">Réinitialiser</button>
      </div>
      <div class="lcse-filters-grid ${state.filtersOpen ? "" : "lcse-hidden"}">
        ${renderCombo("region", "Région", options.region, state.region, combo.region)}
        ${renderCombo("dept", "Département", options.dept, state.dept, combo.dept)}
        ${renderCombo("fede", "Fédération", options.fede, state.fede, combo.fede)}
        ${renderCombo("club", "Club", options.club, state.club, combo.club)}
      </div>
    </section>

    ${renderTabs(TABS, state.tab, counts)}

    <p class="lcse-count">${countLabel}</p>

    ${list.length === 0 ? renderEmptyState() : `<div class="lcse-grid">${pagination.page.map(renderCard).join("")}</div>`}
    ${renderLoadMore(pagination)}
  `;

    modalRoot.innerHTML = renderModal(openAction, state);

    bindEvents();
  }

  // ---------------------------------------------------------------------
  // Événements
  // ---------------------------------------------------------------------

  function bindEvents() {
    app.querySelectorAll("[data-filter]").forEach((el) => {
      const key = el.getAttribute("data-filter");

      el.addEventListener("focus", () => {
        combo[key].open = true;
        combo[key].query = "";
        el.select();
        updateComboList(key);
      });

      el.addEventListener("input", () => {
        combo[key].query = el.value;
        updateComboList(key);
      });

      el.addEventListener("blur", () => {
        setTimeout(() => {
          combo[key].open = false;
          combo[key].query = "";
          render();
        }, 100);
      });

      el.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          combo[key].open = false;
          combo[key].query = "";
          el.blur();
        } else if (e.key === "Enter") {
          e.preventDefault();
          const options = getFilterOptions(actions, state)[key];
          const [first] = filterOptionsByQuery(options, combo[key].query);
          if (first !== undefined) selectFilterValue(key, first);
        }
      });
    });

    app.querySelectorAll("[data-combo-list]").forEach((listEl) => {
      const key = listEl.getAttribute("data-combo-list");
      // Empêche l'input de perdre le focus (et donc la liste de se fermer)
      // avant que le clic sur une option n'ait pu être traité.
      listEl.addEventListener("mousedown", (e) => e.preventDefault());
      listEl.addEventListener("click", (e) => {
        const li = e.target.closest("[data-value]");
        if (!li) return;
        selectFilterValue(key, li.getAttribute("data-value"));
      });
    });

    app.querySelectorAll('[data-action="reset"]').forEach((el) => {
      el.addEventListener("click", () => {
        state.region = ALL; state.dept = ALL; state.fede = ALL; state.club = ALL;
        state.visibleCount = PAGE_SIZE;
        // L'onglet n'est pas un filtre : "Réinitialiser" ne le change pas.
        FILTER_KEYS.forEach((key) => { combo[key].open = false; combo[key].query = ""; });
        render();
      });
    });

    app.querySelectorAll('[data-action="toggle-filters"]').forEach((el) => {
      el.addEventListener("click", () => {
        state.filtersOpen = !state.filtersOpen;
        render();
      });
    });

    app.querySelectorAll("[data-tab]").forEach((el) => {
      el.addEventListener("click", () => {
        const tab = el.getAttribute("data-tab");
        if (tab === state.tab) return;
        state.tab = tab;
        // La pagination repart du premier lot : l'autre onglet n'a rien à
        // voir avec ce qui était déroulé ici.
        state.visibleCount = PAGE_SIZE;
        // Les filtres sont conservés : c'est justement l'intérêt de voir
        // les compteurs des deux onglets sur un même périmètre.
        FILTER_KEYS.forEach((key) => { combo[key].open = false; combo[key].query = ""; });
        render();
      });
    });

    app.querySelectorAll('[data-action="load-more"]').forEach((el) => {
      el.addEventListener("click", () => {
        state.visibleCount += PAGE_SIZE;
        // render() remplace tout le contenu de <main> : on remet le
        // défilement où il était, sinon le clic renvoie en haut de page.
        const y = window.scrollY;
        render();
        window.scrollTo(0, y);
      });
    });

    app.querySelectorAll('[data-action="support"]').forEach((el) => {
      el.addEventListener("click", () => {
        state.openActionId = Number(el.getAttribute("data-id"));
        state.sent = false;
        state.submitError = "";
        render();
      });
    });

    modalRoot.querySelectorAll('[data-action="close"]').forEach((el) => {
      el.addEventListener("click", () => {
        state.openActionId = null;
        state.sent = false;
        state.submitError = "";
        render();
      });
    });

    const modalContent = modalRoot.querySelector(".modal-content");
    if (modalContent) modalContent.addEventListener("click", (e) => e.stopPropagation());

    const form = document.getElementById("lcse-support-form");
    if (form) form.addEventListener("submit", onSubmitForm);
  }

  // Ne met à jour que la liste déroulante d'un combobox (pas tout `app`),
  // pour ne pas faire perdre le focus/curseur de l'input pendant la frappe.
  function updateComboList(key) {
    const listEl = app.querySelector(`[data-combo-list="${key}"]`);
    const inputEl = document.getElementById(`lcse-filter-${key}`);
    if (!listEl || !inputEl) return;
    const options = getFilterOptions(actions, state)[key];
    listEl.innerHTML = comboOptionsHtml(options, combo[key].query, state[key]);
    listEl.classList.toggle("lcse-hidden", !combo[key].open);
    inputEl.setAttribute("aria-expanded", combo[key].open ? "true" : "false");
  }

  function selectFilterValue(key, value) {
    state[key] = value;
    if (key === "region") state.dept = ALL;
    state.visibleCount = PAGE_SIZE;
    combo[key].open = false;
    combo[key].query = "";
    render();
  }

  async function onSubmitForm(e) {
    e.preventDefault();
    const action = actions.find((a) => a.id === state.openActionId);
    if (!action) return;

    const data = new FormData(e.target);
    const montantRaw = data.get("montant");

    state.submitting = true;
    state.submitError = "";
    render();

    try {
      await grist.docApi.applyUserActions([[
        "AddRecord",
        TABLES.soutiens,
        null,
        {
          Organisation: String(data.get("organisation") || "").trim(),
          Prenom: String(data.get("prenom") || "").trim(),
          Nom: String(data.get("nom") || "").trim(),
          Email: String(data.get("email") || "").trim(),
          Telephone: String(data.get("telephone") || "").trim(),
          Montant: montantRaw ? Number(montantRaw) : null,
          Message: String(data.get("message") || "").trim(),
          Date: Math.floor(Date.now() / 1000),
          Action_financee: action.id,
        },
      ]]);
      state.submitting = false;
      state.sent = true;
      render();
    } catch (err) {
      state.submitting = false;
      state.submitError = "L'envoi a échoué : " + (err && err.message ? err.message : "erreur inconnue") + ". Réessayez.";
      render();
    }
  }

  // ---------------------------------------------------------------------
  // Démarrage
  // ---------------------------------------------------------------------

  grist.ready({ requiredAccess: "full" });

  render();

  fetchAll()
    .then(render)
    .catch((err) => {
      loaded = true;
      loadError = (err && err.message) ? err.message : "Erreur inconnue lors du chargement.";
      render();
    });
})();

</script>
</body>
</html>
